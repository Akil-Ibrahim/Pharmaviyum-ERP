# ============================================================================
# Prometheus Configuration for Pharmaviyum CRM
# Best practice 2026: Comprehensive monitoring
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --------------------------------------------------------------------------
  # FastAPI Application Metrics
  # --------------------------------------------------------------------------
  - job_name: 'pharmaviyum-api'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # --------------------------------------------------------------------------
  # PostgreSQL Metrics (if using postgres_exporter)
  # --------------------------------------------------------------------------
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'database'
          environment: 'production'

  # --------------------------------------------------------------------------
  # Redis Metrics (if using redis_exporter)
  # --------------------------------------------------------------------------
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'cache'
          environment: 'production'

  # --------------------------------------------------------------------------
  # Node Exporter (system metrics)
  # --------------------------------------------------------------------------
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'
          environment: 'production'
