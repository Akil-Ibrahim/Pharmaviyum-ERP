# ============================================================================
# Prometheus Configuration for Pharmaviyum CRM
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # FastAPI application metrics. The monitoring compose joins the application
  # network so the service name resolves without exposing Prometheus publicly.
  - job_name: 'pharmaviyum-api'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
          environment: '${ENVIRONMENT:-development}'
    metrics_path: '/metrics'
    scrape_interval: 10s
