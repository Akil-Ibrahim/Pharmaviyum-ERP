[project]
name = "pharmaviyum-crm"
version = "0.1.0"
description = "Pharmacy ERP/CRM platform with Mortarium AI"
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
dependencies = [
    # API and application
    "fastapi[standard]==0.162.5",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "structlog==25.5.0",
    "slowapi==0.1.9",

    # Database and migrations
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "pgvector==0.4.1",
    "psycopg[binary,pool]==3.3.9",

    # Cache and background workers
    "redis==8.1.0",
    "celery==5.6.3",

    # AI orchestration
    "langgraph==1.2.21",
    "langgraph-checkpoint-postgres==3.1.3",
    "langchain==1.4.0",
    "langchain-ollama==1.1.0",
    "langchain-groq==1.1.0",
    "langchain-openai==1.6.2",
    "langchain-google-genai==4.4.0",

    # Cloud and authentication
    "boto3==1.44.1",
    "PyJWT==2.15.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.3.0",
    "python-multipart==0.0.32",

    # HTTP clients
    "httpx==0.28.1",
    "aiohttp==3.14.5",
    "multidict==6.9.1",

    # Documents and RAG ingestion
    "aiofiles==25.1.0",
    "beautifulsoup4==4.14.2",
    # Pin the fixed release; 3.0.4 is flagged by pip-audit (GHSA-mmhr-3c5m-f64f).
    "soupsieve==4.1",
    "pypdf==6.21.4",
    "python-docx==1.2.0",
    "pytesseract==0.3.13",
    "Pillow==13.0.0",
    "PyMuPDF==1.26.7",
    "readability-lxml==0.8.4.1",
    "langdetect==1.0.9",

    # Utilities and serialization
    "python-dotenv==1.2.3",
    "email-validator==2.3.0",
    "protobuf==7.36.2",

    # Observability
    "prometheus-client==0.26.0",
    "psutil==7.2.2",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-instrumentation-redis==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "factory-boy==3.3.1",
    "faker==40.52.0",
    "ruff==0.16.8",
    "black==26.10.1",
    "isort==6.0.1",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "bandit==1.9.4",
    "pre-commit==4.7.0",
    "types-aiofiles>=24.1.0.20250822",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-passlib>=1.7.7.20250617",
    "types-psutil==7.2.2.20261111",
]
eval = [
    # ONNX Runtime has no CPython 3.15 wheel yet; keep this optional evaluation helper for 3.14 and older.
    "fastembed==0.9.1; python_version < '3.15'",
]

[tool.uv]
# pyproject.toml is the dependency source of truth; uv.lock pins resolved versions.

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
# Preserve Ruff’s established default rule set; do not silently enable hundreds of new rules on upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 88
target-version = ["py315"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
concurrency = ["thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.fastapi]
entrypoint = "src.pharmaviyum.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmaviyum"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.15"

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "langdetect", "fitz", "pytesseract", "readability", "celery.*"]
ignore_missing_imports = true
