[project]
name = "pharmaviyum-crm"
version = "0.1.0"
description = "AI-powered CRM for pharmacies"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # Core
    "fastapi==0.139.0",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",

    # Database
    "sqlalchemy==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.16.2",
    "pgvector==0.4.1",
    "psycopg[binary,pool]==3.3.5",

    # Redis
    "redis==6.2.0",

    # AI / LangGraph
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain==1.4.0",
    "langchain-ollama==1.1.0",

    # Security
    "PyJWT==2.14.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.32",

    # HTTP
    "httpx==0.28.1",
    "aiohttp==3.13.3",

    # Utilities
    "python-dotenv==1.2.3",
    "email-validator==2.2.0",

    # Serialization security floor
    "protobuf==5.29.6",

    # Observability
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "pre-commit>=4.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
