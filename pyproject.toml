[project]
name = "pharmaviyum-crm"
version = "0.1.0"
description = "Pharmacy ERP/CRM platform with Mortarium AI"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    # API and application
    "fastapi[standard]==0.143.0",
    "starlette>=1.7.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "structlog==25.5.0",
    "slowapi==0.1.9",

    # Database and migrations
    "sqlalchemy==2.0.53",
    "asyncpg==0.30.0",
    "alembic==1.20.0",
    "pgvector==0.4.1",
    "psycopg[binary,pool]==3.3.6",

    # Cache and background workers
    "redis==6.2.0",
    "celery==5.5.3",

    # AI orchestration
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.3",
    "langchain==1.4.0",
    "langchain-ollama==1.1.0",
    "langchain-groq==1.1.0",
    "langchain-openai==1.6.2",
    "langchain-google-genai==4.4.0",

    # Cloud and authentication
    "boto3==1.40.30",
    "PyJWT==2.15.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.3.0",
    "python-multipart==0.0.32",

    # HTTP clients
    "httpx==0.28.1",
    "aiohttp==3.14.4",
    "multidict==6.9.1",

    # Documents and RAG ingestion
    "aiofiles==24.1.0",
    "beautifulsoup4==4.14.2",
    "pypdf==6.21.2",
    "python-docx==1.2.0",
    "pytesseract==0.3.13",
    "Pillow==13.0.0",
    "PyMuPDF==1.26.7",
    "readability-lxml==0.8.4.1",
    "langdetect==1.0.9",

    # Utilities and serialization
    "python-dotenv==1.2.3",
    "email-validator==2.3.0",
    "protobuf==5.29.6",

    # Observability
    "prometheus-client==0.21.0",
    "psutil==6.0.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "factory-boy==3.3.1",
    "faker==30.8.2",
    "ruff==0.12.10",
    "black==26.10.1",
    "isort==6.0.1",
    "mypy==1.17.1",
    "pip-audit==2.9.0",
    "bandit==1.8.6",
    "pre-commit==4.3.0",
    "types-aiofiles>=24.1.0.20250822",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-passlib>=1.7.7.20250617",
    "types-psutil>=7.0.0.20250822",
]
eval = [
    "fastembed==0.9.1",
]

[tool.uv]
# pyproject.toml is the dependency source of truth; uv.lock pins resolved versions.

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
concurrency = ["thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.fastapi]
entrypoint = "src.pharmaviyum.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmaviyum"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "langdetect", "fitz", "pytesseract", "readability", "celery.*"]
ignore_missing_imports = true
