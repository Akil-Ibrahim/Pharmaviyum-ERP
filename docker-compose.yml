# ============================================================================
# PHARMAVIYUM AI - Full Stack Docker Compose
# Python 3.15.2 + PostgreSQL 18 (pgvector 0.8.7) + Redis 8.8 + Ollama + Celery
# ============================================================================

version: '3.8'

services:
  # PostgreSQL 18 with pgvector 0.8.7
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    container_name: pharmaviyum-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmaviyum
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmaviyum"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - pharmaviyum-network

  # Redis 8.8
  redis:
    image: redis:8.8-alpine
    container_name: pharmaviyum-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pharmaviyum-network

  # Ollama (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: pharmaviyum-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - pharmaviyum-network

  # Jaeger provides a local trace UI for development.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: pharmaviyum-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped
    networks:
      - pharmaviyum-network

  # OTLP receiver and trace pipeline for local development.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.1
    container_name: pharmaviyum-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    restart: unless-stopped
    networks:
      - pharmaviyum-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmaviyum-api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      PGVECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pharmaviyum
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-qwen3.5:9b}
      OLLAMA_MAIN_MODEL: ${OLLAMA_MAIN_MODEL:-qwen3.5:9b}
      OLLAMA_COMPLEX_MODEL: ${OLLAMA_COMPLEX_MODEL:-qwen3.5:9b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large}
      LANGSMITH_ENABLED: ${LANGSMITH_ENABLED:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-pharmaviyum-pharmacist-agent}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-http://otel-collector:4317}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-0.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      otel-collector:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: >
      sh -c "
        echo '⏳ Waiting for services...' &&
        sleep 5 &&
        echo '️  Running database migrations...' &&
        alembic upgrade head &&
        echo '✅ Migrations complete. Starting FastAPI...' &&
        uvicorn src.pharmaviyum.main:app --host 0.0.0.0 --port 8000 --reload
      "
    restart: unless-stopped
    networks:
      - pharmaviyum-network

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmaviyum-celery-worker
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pharmaviyum
      PGVECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pharmaviyum
      OLLAMA_BASE_URL: http://ollama:11434
      PHARMAVIYUM_EDGE_NODE_ID: ${PHARMAVIYUM_EDGE_NODE_ID:-}
      PHARMAVIYUM_EDGE_TOKEN: ${PHARMAVIYUM_EDGE_TOKEN:-}
      PHARMAVIYUM_CENTRAL_SYNC_URL: ${PHARMAVIYUM_CENTRAL_SYNC_URL:-}
      PHARMAVIYUM_SYNC_BATCH_SIZE: ${PHARMAVIYUM_SYNC_BATCH_SIZE:-50}
      PHARMAVIYUM_SYNC_LEASE_SECONDS: ${PHARMAVIYUM_SYNC_LEASE_SECONDS:-30}
      PHARMAVIYUM_SYNC_HTTP_TIMEOUT_SECONDS: ${PHARMAVIYUM_SYNC_HTTP_TIMEOUT_SECONDS:-10}
    depends_on:
      - postgres
      - redis
      - ollama
    volumes:
      - ./src:/app/src
    command: >
      sh -c "
        echo '🔄 Starting Celery worker...' &&
        celery -A src.pharmaviyum.ai.mortarium_rag.ingestion.celery_app worker 
          --loglevel=info 
          --concurrency=2 
          --queues=ingestion,maintenance
      "
    restart: unless-stopped
    networks:
      - pharmaviyum-network

  # Celery Beat schedules durable outbox polling. Run one Beat instance per Edge node.
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmaviyum-celery-beat
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pharmaviyum
      PGVECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pharmaviyum
      OLLAMA_BASE_URL: http://ollama:11434
      PHARMAVIYUM_EDGE_NODE_ID: ${PHARMAVIYUM_EDGE_NODE_ID:-}
      PHARMAVIYUM_EDGE_TOKEN: ${PHARMAVIYUM_EDGE_TOKEN:-}
      PHARMAVIYUM_CENTRAL_SYNC_URL: ${PHARMAVIYUM_CENTRAL_SYNC_URL:-}
      PHARMAVIYUM_SYNC_BATCH_SIZE: ${PHARMAVIYUM_SYNC_BATCH_SIZE:-50}
      PHARMAVIYUM_SYNC_LEASE_SECONDS: ${PHARMAVIYUM_SYNC_LEASE_SECONDS:-30}
      PHARMAVIYUM_SYNC_HTTP_TIMEOUT_SECONDS: ${PHARMAVIYUM_SYNC_HTTP_TIMEOUT_SECONDS:-10}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src:/app/src
    command: >
      celery -A src.pharmaviyum.ai.mortarium_rag.ingestion.celery_app beat
        --loglevel=info
    restart: unless-stopped
    networks:
      - pharmaviyum-network

volumes:
  postgres_data_pg18:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local

networks:
  pharmaviyum-network:
    driver: bridge
    name: pharmaviyum-network
