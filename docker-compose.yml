version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pharmaviyum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: pharmaviyum
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pharmaviyum-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmaviyum-backend
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://app_user:secure_password@db:5432/pharmaviyum
      - AI_SERVICE_URL=http://mortarium-ai:8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - app-network

  mortarium-ai:
    build:
      context: ./mortarium-ai
      dockerfile: Dockerfile
    container_name: pharmaviyum-ai
    restart: unless-stopped
    environment:
      - MODEL_NAME=Qwen3-8B-Instruct-Q4_K_M.gguf
    volumes:
      - ./mortarium-ai/models:/app/models
      - ./mortarium-ai/data:/app/data
    ports:
      - "8001:8000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: pharmaviyum-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network

volumes:
  pgdata:
  redis-data:

networks:
  app-network:
    driver: bridge
