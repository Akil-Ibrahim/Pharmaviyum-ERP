services:
  - type: web
    name: pharmaviyum-erp-crm
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    plan: free
    autoDeployTrigger: checksPass
    dockerCommand: >-
      sh -c 'alembic upgrade head &&
      exec uvicorn src.pharmaviyum.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: API_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: pharmaviyum-postgres
          property: connectionString
      - key: PGVECTOR_DATABASE_URL
        fromDatabase:
          name: pharmaviyum-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pharmaviyum-redis
          property: connectionString
      - key: USE_CLOUD_LLM
        value: "true"
      - key: CLOUD_LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_COMPLEX_MODEL
        value: gemini-2.5-pro
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "1024"
