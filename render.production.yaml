services:
  - type: web
    name: pharmaviyum-crm
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    plan: starter
    autoDeployTrigger: checksPass
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn src.pharmaviyum.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: API_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: pharmaviyum-postgres-production
          property: connectionString
      - key: PGVECTOR_DATABASE_URL
        fromDatabase:
          name: pharmaviyum-postgres-production
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pharmaviyum-redis-production
          property: connectionString
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_FAST_MODEL
        sync: false
      - key: OLLAMA_MAIN_MODEL
        sync: false
      - key: OLLAMA_COMPLEX_MODEL
        sync: false
      - key: OLLAMA_EMBEDDING_MODEL
        sync: false

  - type: keyvalue
    name: pharmaviyum-redis-production
    plan: starter
    ipAllowList: []

databases:
  - name: pharmaviyum-postgres-production
    databaseName: pharmaviyum
    user: pharmaviyum
    postgresMajorVersion: "16"
    plan: basic-256mb
    ipAllowList: []
