# ============================================================================
# PHARMAVIYUM AI - Codespaces Configuration
# NO GPU - Uses cloud LLM APIs (Groq/OpenAI/Anthropic)
# ============================================================================

version: '3.8'

services:
  # PostgreSQL 16 with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pharmaviyum-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmaviyum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmaviyum"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: pharmaviyum-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Application (uses cloud LLM APIs)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmaviyum-api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # PostgreSQL
      PGVECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pharmaviyum
      
      # Cloud LLM APIs (NO Ollama in Codespaces!)
      USE_CLOUD_LLM: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-70b-versatile}
      
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      
      # LangSmith
      LANGSMITH_ENABLED: ${LANGSMITH_ENABLED:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      
      # OpenTelemetry
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: >
      sh -c "
        sleep 5 &&
        alembic upgrade head &&
        uvicorn src.pharmaviyum.main:app --host 0.0.0.0 --port 8000 --reload
      "
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmaviyum-celery-worker
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      REDIS_URL: redis://redis:6379/0
      PGVECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pharmaviyum
      USE_CLOUD_LLM: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src:/app/src
    command: >
      sh -c "
        celery -A src.pharmaviyum.ai.mortarium_rag.ingestion.celery_app worker 
          --loglevel=info 
          --concurrency=2
      "
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
