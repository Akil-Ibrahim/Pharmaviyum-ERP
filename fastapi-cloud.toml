# FastAPI Cloud Deployment Configuration

[project]
name = "pharmaviyum-crm"
framework = "fastapi"
python_version = "3.14"

[deployment]
region = "ap-southeast-1"
auto_scale = true
min_instances = 1
max_instances = 10

[database]
engine = "postgresql"
version = "16"
extensions = ["vector", "pg_trgm"]
