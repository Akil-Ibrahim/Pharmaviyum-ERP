# Development overrides
# Automatically applied when running 'docker compose up'
# Adds code mounting, ports, and debugging features

services:
  backend:
    # Mount local source code for hot-reloading during development
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    # Expose backend port for direct access from host
    ports:
      - "8000:8000"
    # Environment variables for development mode
    environment:
      - DEBUG=true

  frontend:
    # Mount local source code for hot-reloading during development
    volumes:
      - ./frontend/shadcn-admin:/app
      - /app/node_modules
      - /app/.next
    # Expose frontend port for direct access from host
    ports:
      - "3000:3000"
    # Environment variables for development mode
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_BASE=/api/v1
      - NEXT_PUBLIC_AI_SERVICE_URL=http://localhost:8001
    command: pnpm dev

