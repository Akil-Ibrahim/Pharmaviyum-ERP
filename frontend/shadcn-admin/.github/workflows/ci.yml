name: Frontend CI

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'frontend/shadcn-admin/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'frontend/shadcn-admin/**'
      - '.github/workflows/**'

jobs:
  install-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/shadcn-admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Install dependencies
        run: bun install

      - name: Lint the code
        run: bun run lint

      - name: Run Prettier check
        run: bun run format:check

      - name: Install browsers
        run: bun run test:browser:install

      - name: Run tests
        run: bun run test

      - name: Build the project
        run: bun run build
