---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml
driver:
  name: docker
platforms:
  - name: pharmaviyum-ansible-test
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    privileged: true
    user: root
    pre_build_image: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=1777
provisioner:
  name: ansible
  inventory:
    host_vars:
      pharmaviyum-ansible-test:
        app_environment: staging
        app_directory: /opt/pharmaviyum
        deploy_user: molecule
        docker_compose_project: pharmaviyum
        app_version: "test-release"
        backend_image: "ghcr.io/ibrahimengpy/pharmaviyum-crm"
        postgres_password: "molecule-test-password"
        ghcr_username: ""
        ghcr_token: ""
        ansible_remote_tmp: /root/.ansible/tmp
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
