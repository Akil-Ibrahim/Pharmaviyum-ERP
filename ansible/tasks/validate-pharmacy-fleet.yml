---
- name: Enforce the 100-site architecture inventory ceiling
  ansible.builtin.assert:
    that:
      - groups['pharmacy_servers'] is defined
      - groups['pharmacy_servers'] | length >= 1
      - groups['pharmacy_servers'] | length <= (max_supported_pharmacy_sites | int)
    fail_msg: >-
      The inventory must contain between 1 and {{ max_supported_pharmacy_sites }}
      pharmacy sites. The 100-site value is an architecture ceiling, not an
      active rollout size.
  run_once: true
  delegate_to: localhost

- name: Enforce the active rollout limit against hosts selected for this run
  ansible.builtin.assert:
    that:
      - active_rollout_limit | int >= 1
      - active_rollout_limit | int <= (max_supported_pharmacy_sites | int)
      - ansible_play_hosts_all | length >= 1
      - ansible_play_hosts_all | length <= (active_rollout_limit | int)
    fail_msg: >-
      active_rollout_limit must be between 1 and
      {{ max_supported_pharmacy_sites }}. This run selected
      {{ ansible_play_hosts_all | length }} pharmacy hosts, but the active
      rollout limit is {{ active_rollout_limit }}.
  run_once: true
  delegate_to: localhost

- name: Require unique pharmacy IDs across the complete inventory
  ansible.builtin.assert:
    that:
      - hostvars[item].pharmacy_id is defined
      - hostvars[item].pharmacy_id | string | length > 0
    fail_msg: "Every inventory pharmacy must define a non-empty pharmacy_id."
  loop: "{{ groups['pharmacy_servers'] }}"
  run_once: true
  delegate_to: localhost

- name: Require globally unique pharmacy IDs
  ansible.builtin.assert:
    that:
      - >-
        (groups['pharmacy_servers']
        | map('extract', hostvars, 'pharmacy_id')
        | list | unique | list | length)
        == (groups['pharmacy_servers'] | length)
    fail_msg: "Every pharmacy in the complete inventory must have a unique pharmacy_id."
  run_once: true
  delegate_to: localhost

- name: Require non-empty site codes across the complete inventory
  ansible.builtin.assert:
    that:
      - hostvars[item].site_code is defined
      - hostvars[item].site_code | string | length > 0
    fail_msg: "Every inventory pharmacy must define a non-empty site_code."
  loop: "{{ groups['pharmacy_servers'] }}"
  run_once: true
  delegate_to: localhost

- name: Require globally unique site codes
  ansible.builtin.assert:
    that:
      - >-
        (groups['pharmacy_servers']
        | map('extract', hostvars, 'site_code')
        | list | unique | list | length)
        == (groups['pharmacy_servers'] | length)
    fail_msg: "Every pharmacy in the complete inventory must have a unique site_code."
  run_once: true
  delegate_to: localhost

- name: Validate SSH endpoint, user, and site identity for selected hosts
  ansible.builtin.assert:
    that:
      - hostvars[item].ansible_host is defined
      - hostvars[item].ansible_host | string | length > 0
      - hostvars[item].ansible_user is defined
      - hostvars[item].ansible_user | string | length > 0
      - hostvars[item].site_code is defined
      - hostvars[item].site_code | string | length > 0
    fail_msg: "Every selected Edge must define a real SSH endpoint, SSH user, and site_code."
  loop: "{{ ansible_play_hosts_all }}"
  run_once: true
  delegate_to: localhost

- name: Require approved Docker package pins before opening SSH connections
  ansible.builtin.assert:
    that:
      - docker_package_versions is mapping
      - docker_package_versions[item] is defined
      - docker_package_versions[item] | string | length > 0
    fail_msg: "Set an approved Docker package version for {{ item }} before deployment."
  loop: "{{ docker_package_names }}"
  run_once: true
  delegate_to: localhost

- name: Require Edge sync configuration to be all enabled or all disabled
  ansible.builtin.assert:
    that:
      - >-
        (hostvars[item].pharmaviyum_edge_node_id | default('') | length == 0
        and hostvars[item].pharmaviyum_edge_token | default('') | length == 0
        and hostvars[item].pharmaviyum_central_sync_url | default('') | length == 0)
        or
        (hostvars[item].pharmaviyum_edge_node_id | default('') | length > 0
        and hostvars[item].pharmaviyum_edge_token | default('') | length > 0
        and hostvars[item].pharmaviyum_central_sync_url | default('') | length > 0)
    fail_msg: "Configure Edge node ID, token and Central URL together for each selected site, or leave all three empty."
  loop: "{{ ansible_play_hosts_all }}"
  run_once: true
  delegate_to: localhost

- name: Validate enabled Edge sync credentials and HTTPS endpoint
  ansible.builtin.assert:
    that:
      - >-
        hostvars[item].pharmaviyum_edge_node_id is match(
        '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        )
      - hostvars[item].pharmaviyum_edge_token | length >= 32
      - hostvars[item].pharmaviyum_central_sync_url is match('^https://[^/]+(/.*)?$')
    fail_msg: "Enabled Edge sync requires a UUID, a high-entropy token and an HTTPS Central URL."
  no_log: true
  loop: "{{ ansible_play_hosts_all }}"
  run_once: true
  delegate_to: localhost
  when: hostvars[item].pharmaviyum_edge_node_id | default('') | length > 0

- name: Require immutable application release
  ansible.builtin.assert:
    that:
      - app_version is defined
      - app_version | string | length > 0
      - app_version != "latest"
    fail_msg: "app_version must be an immutable release tag, never latest."
  run_once: true
  delegate_to: localhost

- name: Require an immutable backend image digest
  ansible.builtin.assert:
    that:
      - backend_image_digest is match('^sha256:[0-9a-f]{64}$')
    fail_msg: "Set PHARMAVIYUM_BACKEND_IMAGE_DIGEST to the approved sha256 digest before deployment."
  run_once: true
  delegate_to: localhost

- name: Require a unique database credential for every selected pharmacy
  ansible.builtin.assert:
    that:
      - hostvars[item].postgres_password is defined
      - hostvars[item].postgres_password | string | length > 0
    fail_msg: "Each selected pharmacy must provide its own PostgreSQL password through encrypted host variables or a secret manager."
  no_log: true
  loop: "{{ ansible_play_hosts_all }}"
  run_once: true
  delegate_to: localhost

- name: Require unique PostgreSQL credentials across configured inventory sites
  ansible.builtin.assert:
    that:
      - >-
        (groups['pharmacy_servers']
        | map('extract', hostvars)
        | map(attribute='postgres_password', default='')
        | select | list | unique | list | length)
        ==
        (groups['pharmacy_servers']
        | map('extract', hostvars)
        | map(attribute='postgres_password', default='')
        | select | list | length)
    fail_msg: "Every configured PostgreSQL credential must be unique across the complete inventory."
  no_log: true
  run_once: true
  delegate_to: localhost

- name: Require globally unique configured Edge node IDs
  ansible.builtin.assert:
    that:
      - >-
        (groups['pharmacy_servers']
        | map('extract', hostvars)
        | map(attribute='pharmaviyum_edge_node_id', default='')
        | select | list | unique | list | length)
        ==
        (groups['pharmacy_servers']
        | map('extract', hostvars)
        | map(attribute='pharmaviyum_edge_node_id', default='')
        | select | list | length)
    fail_msg: "Every configured Edge node ID must be unique across the complete inventory."
  run_once: true
  delegate_to: localhost
