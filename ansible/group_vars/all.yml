---
app_name: pharmaviyum
app_version: "{{ lookup('env', 'PHARMAVIYUM_APP_VERSION') }}"
app_environment: production

container_registry: ghcr.io
backend_image: "ghcr.io/ibrahimengpy/pharmaviyum-crm"

backend_port: 8000
backend_workers: 2
backend_log_level: info

postgres_version: "16"
postgres_db: pharmaviyum
postgres_user: app_user
postgres_password: "{{ lookup('env', 'PHARMAVIYUM_POSTGRES_PASSWORD') }}"
postgresql_data_dir: /opt/pharmaviyum/data/postgres

redis_image: "valkey/valkey:8-alpine"

ghcr_username: "{{ lookup('env', 'PHARMAVIYUM_GHCR_USERNAME') }}"
ghcr_token: "{{ lookup('env', 'PHARMAVIYUM_GHCR_TOKEN') }}"

backup_enabled: true
backup_schedule: "0 2 * * *"
backup_retention_days: 7
