---
# Global variables for Pharmaviyum-CRM Ansible deployment
# All values can be overridden per host/group in inventory

# Application configuration
app_name: pharmaviyum-crm
app_version: "1.0.0"
app_environment: production  # options: production, staging, demo

# Docker settings
docker_version: "24.0"
docker_compose_version: "v2.20.0"

# PostgreSQL configuration
postgres_version: "15"
postgres_db: pharmaviyum
postgres_user: app_user
postgres_password: "{{ vault_postgres_password }}"  # encrypted via ansible-vault
postgres_data_dir: /opt/pharmaviyum/data/postgres

# FastAPI backend settings
backend_port: 8000
backend_workers: 2  # conservative for pharmacy PCs with limited RAM
backend_log_level: info

# Mortarium AI RAG service settings
mortarium_port: 8001
mortarium_model_path: /opt/pharmaviyum/models/Qwen3-8B-Instruct-Q4_K_M.gguf
mortarium_context_length: 32000
mortarium_vector_store_path: /opt/pharmaviyum/data/vector_store

# Nginx reverse proxy settings
nginx_domain: localhost  # override per deployment
nginx_ssl_enabled: false  # enable for production with valid cert

# Backup configuration
backup_enabled: true
backup_schedule: "0 2 * * *"  # daily at 2 AM
backup_retention_days: 7
