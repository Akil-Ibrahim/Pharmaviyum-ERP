---
app_name: pharmaviyum-crm
# Must be supplied at deploy time as an immutable Git SHA tag.
app_version: ""
app_environment: production

container_registry: ghcr.io
backend_image: "ghcr.io/ibrahimengpy/pharmaviyum-crm"

backend_port: 8000
backend_workers: 2
backend_log_level: info

postgres_version: "16"
postgres_db: pharmaviyum
postgres_user: app_user
postgresql_data_dir: /opt/pharmaviyum/data/postgres

redis_image: "valkey/valkey:8-alpine"

backup_enabled: true
backup_schedule: "0 2 * * *"
backup_retention_days: 7
