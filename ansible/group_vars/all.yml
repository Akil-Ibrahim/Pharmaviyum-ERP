---
app_name: pharmaviyum-crm
app_version: "1.0.0"
app_environment: production

container_registry: ghcr.io
backend_image: "ghcr.io/ibrahimengpy/pharmaviyum-crm-api"
frontend_image: "ghcr.io/ibrahimengpy/pharmaviyum-crm-frontend"

backend_port: 8000
backend_workers: 2
backend_log_level: info

postgres_version: "16"
postgres_db: pharmaviyum
postgres_user: app_user
postgres_data_dir: /opt/pharmaviyum/data/postgres

redis_image: "valkey/valkey:8-alpine"

nginx_domain: localhost
nginx_ssl_enabled: false

backup_enabled: true
backup_schedule: "0 2 * * *"
backup_retention_days: 7
