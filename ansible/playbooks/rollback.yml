---
# Rollback is application-only. Database schema downgrades are never performed.
# First play validates the exact selected wave locally before any SSH access.

- name: Validate rollback request on the Ansible controller
  hosts: pharmacy_servers
  connection: local
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    rollback_approved: false
    rollback_approval_reference: ""
    rollback_target_confirmations: []
    rollback_version: ""
    rollback_image_digest: ""
    rollback_schema_compatibility_confirmed: false
    rollback_schema_compatibility_reference: ""
  tasks:
    - name: Validate rollback approval, exact selected wave and schema compatibility before SSH
      ansible.builtin.assert:
        that:
          - groups['pharmacy_servers'] is defined
          - groups['pharmacy_servers'] | length >= 1
          - groups['pharmacy_servers'] | length <= (max_supported_pharmacy_sites | int)
          - active_rollout_limit | int >= 1
          - active_rollout_limit | int <= (max_supported_pharmacy_sites | int)
          - ansible_play_hosts_all | length >= 1
          - ansible_play_hosts_all | length <= (active_rollout_limit | int)
          - rollback_approved | bool
          - rollback_approval_reference | string | length > 0
          - rollback_target_confirmations is sequence
          - rollback_target_confirmations is not string
          - rollback_target_confirmations | sort == ansible_play_hosts_all | sort
          - rollback_version | string | length > 0
          - rollback_version != "latest"
          - rollback_image_digest is match('^sha256:[0-9a-f]{64}$')
          - rollback_schema_compatibility_confirmed | bool
          - rollback_schema_compatibility_reference | string | length > 0
        fail_msg: >-
          Rollback requires explicit change approval, exact confirmation of
          every selected host, a 1-{{ active_rollout_limit }} site wave, an
          immutable image digest, and documented confirmation that the old
          application release is compatible with the current database schema.
      tags: [preflight]

- name: Roll back Pharmaviyum backend
  hosts: pharmacy_servers
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    rollback_approved: false
    rollback_approval_reference: ""
    rollback_target_confirmations: []
    rollback_version: ""
    rollback_image_digest: ""
    rollback_schema_compatibility_confirmed: false
    rollback_schema_compatibility_reference: ""

  pre_tasks:
    - name: Revalidate rollback authorization and schema compatibility on the selected Edge
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length >= 1
          - ansible_play_hosts_all | length <= (active_rollout_limit | int)
          - rollback_approved | bool
          - rollback_approval_reference | string | length > 0
          - inventory_hostname in rollback_target_confirmations
          - rollback_version | string | length > 0
          - rollback_version != "latest"
          - rollback_image_digest is match('^sha256:[0-9a-f]{64}$')
          - rollback_schema_compatibility_confirmed | bool
          - rollback_schema_compatibility_reference | string | length > 0
        fail_msg: "Rollback request is not approved or lacks schema compatibility evidence."

  tasks:
    - name: Pull rollback image by immutable digest
      community.docker.docker_image:
        name: "{{ backend_image }}@{{ rollback_image_digest }}"
        source: pull

    - name: Set rollback image in Compose environment
      ansible.builtin.lineinfile:
        path: "{{ app_directory }}/.env"
        regexp: '^BACKEND_IMAGE='
        line: "BACKEND_IMAGE={{ backend_image }}@{{ rollback_image_digest }}"
        owner: "{{ deploy_user }}"
        mode: "0600"
      no_log: true

    - name: Start rollback application services
      community.docker.docker_compose_v2:
        project_src: "{{ app_directory }}"
        project_name: "{{ docker_compose_project }}"
        services:
          - backend
          - celery-worker
          - celery-beat
        state: present
        pull: missing

    - name: Wait for rollback readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ backend_port }}/ready"
        status_code: 200
        timeout: 10
        return_content: true
      register: readiness
      retries: 12
      delay: 5
      until:
        - readiness.status == 200
        - readiness.json.status | default('') == 'ready'

    - name: Report rollback release identity
      ansible.builtin.debug:
        msg:
          - "Rolled back {{ inventory_hostname }} to {{ rollback_version }} ({{ rollback_image_digest }})."
          - "Approval: {{ rollback_approval_reference }}."
          - "Schema compatibility evidence: {{ rollback_schema_compatibility_reference }}."
          - "No database schema rollback was performed."
