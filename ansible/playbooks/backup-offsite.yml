---
# Upload an already verified local PostgreSQL dump to a site-scoped Restic
# repository. Repository provisioning, key escrow, retention and restore remain
# separate controller-owned operations; this playbook never initializes or prunes.
#
# Required per-site variables must come from protected Ansible Vault/host_vars:
#   offsite_backup_approved, offsite_backup_approval_reference
#   offsite_backup_file
#   restic_repository_url (rest:https://.../<pharmacy_id>)
#   restic_repository_password, restic_rest_username, restic_rest_password

- name: Validate off-site backup wave on the Ansible controller before SSH
  hosts: pharmacy_servers
  connection: local
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Validate fleet ceiling and selected upload wave before SSH
      ansible.builtin.assert:
        that:
          - groups['pharmacy_servers'] is defined
          - groups['pharmacy_servers'] | length >= 1
          - groups['pharmacy_servers'] | length <= (max_supported_pharmacy_sites | int)
          - active_rollout_limit | int >= 1
          - active_rollout_limit | int <= 10
          - ansible_play_hosts_all | length >= 1
          - ansible_play_hosts_all | length <= (active_rollout_limit | int)
        fail_msg: "Off-site backup requires a valid inventory (max 100) and a selected wave of 1-{{ active_rollout_limit }} pharmacies."
      tags: [preflight]

    - name: Validate site identity, approval, repository isolation and credentials before SSH
      ansible.builtin.assert:
        that:
          - offsite_backup_approved | default(false) | bool
          - offsite_backup_approval_reference | default('') | string | length > 0
          - pharmacy_id is defined
          - pharmacy_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}

- name: Encrypt and upload verified local backup artifacts to Restic
  hosts: pharmacy_servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars_files:
    - ../group_vars/all.yml
  vars:
    restic_binary: /usr/bin/restic
    restic_expected_version: 0.19.1
    restic_cache_directory: /var/cache/restic/pharmaviyum
    restic_environment:
      RESTIC_REPOSITORY: "{{ restic_repository_url }}"
      RESTIC_PASSWORD: "{{ restic_repository_password }}"
      RESTIC_REST_USERNAME: "{{ restic_rest_username }}"
      RESTIC_REST_PASSWORD: "{{ restic_rest_password }}"
      RESTIC_CACHE_DIR: "{{ restic_cache_directory }}/{{ pharmacy_id }}"
  pre_tasks:
    - name: Check Restic executable is installed
      ansible.builtin.stat:
        path: "{{ restic_binary }}"
      register: restic_binary_stat

    - name: Refuse upload when Restic is not installed
      ansible.builtin.assert:
        that:
          - restic_binary_stat.stat.exists
          - restic_binary_stat.stat.executable
        fail_msg: "Install the pinned Restic {{ restic_expected_version }} release before enabling off-site upload."

    - name: Inspect local backup payload, checksum and manifest
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ offsite_backup_file }}"
        - "{{ offsite_backup_file }}.sha256"
        - "{{ offsite_backup_file }}.manifest.yml"
      register: offsite_local_artifacts

    - name: Require all local artifacts to be regular non-empty files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size | int > 0
        fail_msg: "The local dump, SHA-256 sidecar and manifest must all exist and be non-empty."
      loop: "{{ offsite_local_artifacts.results }}"
      loop_control:
        label: "{{ item.item | basename }}"

    - name: Verify local gzip stream before encryption and transfer
      ansible.builtin.command:
        argv:
          - gzip
          - -t
          - "{{ offsite_backup_file }}"
      changed_when: false

    - name: Verify local SHA-256 sidecar before encryption and transfer
      ansible.builtin.command:
        argv:
          - sha256sum
          - --check
          - "{{ offsite_backup_file }}.sha256"
      args:
        chdir: "{{ app_directory }}/backups"
      changed_when: false

    - name: Read local manifest and verify pharmacy identity
      ansible.builtin.slurp:
        src: "{{ offsite_backup_file }}.manifest.yml"
      register: offsite_manifest_raw
      no_log: true

    - name: Parse local manifest
      ansible.builtin.set_fact:
        offsite_manifest: "{{ offsite_manifest_raw.content | b64decode | from_yaml }}"
      no_log: true

    - name: Refuse cross-pharmacy or mismatched backup upload
      ansible.builtin.assert:
        that:
          - offsite_manifest.pharmacy_id == pharmacy_id
          - offsite_manifest.site_code == site_code
          - offsite_manifest.backup_file == (offsite_backup_file | basename)
          - offsite_manifest.database == postgres_db
        fail_msg: "Backup manifest identity does not match the selected pharmacy and database."
      no_log: true

    - name: Check Restic version
      ansible.builtin.command:
        argv:
          - "{{ restic_binary }}"
          - version
      register: restic_version_result
      changed_when: false

    - name: Require a Restic version response
      ansible.builtin.assert:
        that:
          - restic_version_result.stdout is search('restic ' ~ (restic_expected_version | string) ~ '($| )')
        fail_msg: "The Restic executable did not return a valid version."

    - name: Create private Restic cache directory
      ansible.builtin.file:
        path: "{{ restic_cache_directory }}/{{ pharmacy_id }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Confirm the site repository is already initialized; never initialize implicitly
      ansible.builtin.command:
        argv:
          - "{{ restic_binary }}"
          - snapshots
          - --json
      environment: "{{ restic_environment }}"
      register: restic_existing_snapshots
      changed_when: false
      no_log: true

  tasks:
    - name: Upload only the approved local backup set with Restic's default verification enabled
      ansible.builtin.command:
        argv:
          - "{{ restic_binary }}"
          - backup
          - --json
          - --host
          - "{{ inventory_hostname }}"
          - --tag
          - pharmaviyum
          - --tag
          - "{{ pharmacy_id }}"
          - --tag
          - "{{ site_code }}"
          - "{{ offsite_backup_file }}"
          - "{{ offsite_backup_file }}.sha256"
          - "{{ offsite_backup_file }}.manifest.yml"
      environment: "{{ restic_environment }}"
      register: restic_backup_result
      changed_when: true
      no_log: true

    - name: Extract Restic backup summary
      ansible.builtin.set_fact:
        restic_backup_summary: "{{ restic_backup_result.stdout_lines | map('from_json') | selectattr('message_type', 'equalto', 'summary') | list | last }}"
      no_log: true

    - name: Require a Restic snapshot identifier
      ansible.builtin.assert:
        that:
          - restic_backup_summary.snapshot_id is defined
          - restic_backup_summary.snapshot_id is match('^[0-9a-f]{8,64}$')
        fail_msg: "Restic did not return a valid snapshot ID."
      no_log: true

    - name: Independently list remote snapshots after upload
      ansible.builtin.command:
        argv:
          - "{{ restic_binary }}"
          - snapshots
          - --json
      environment: "{{ restic_environment }}"
      register: restic_remote_snapshots
      changed_when: false
      no_log: true

    - name: Match the uploaded snapshot in the remote repository
      ansible.builtin.set_fact:
        restic_remote_snapshot_matches: "{{ (restic_remote_snapshots.stdout | from_json) | selectattr('id', 'search', '^' ~ (restic_backup_summary.snapshot_id | regex_escape)) | list }}"
      no_log: true

    - name: Confirm snapshot ID, host and pharmacy tags in the remote repository
      ansible.builtin.assert:
        that:
          - restic_remote_snapshot_matches | length == 1
          - restic_remote_snapshot_matches[0].hostname == inventory_hostname
          - pharmacy_id in restic_remote_snapshot_matches[0].tags
          - site_code in restic_remote_snapshot_matches[0].tags
          - offsite_backup_file in restic_remote_snapshot_matches[0].paths
        fail_msg: "The uploaded snapshot is missing or its remote host/site identity does not match."
      no_log: true

    - name: Report off-site backup verification without exposing secrets
      ansible.builtin.debug:
        msg:
          - "Encrypted Restic snapshot uploaded and confirmed visible in the site repository for {{ pharmacy_id }} ({{ site_code }})."
          - "Snapshot ID: {{ restic_backup_summary.snapshot_id }}."
          - "Approval reference: {{ offsite_backup_approval_reference }}."
          - "Local artifacts were retained; no remote prune or local cleanup was run."
)
          - site_code is defined
          - site_code | string | length > 0
          - restic_repository_url is match('^rest:https://')
          - restic_repository_url is search('/' ~ (pharmacy_id | regex_escape) ~ '

