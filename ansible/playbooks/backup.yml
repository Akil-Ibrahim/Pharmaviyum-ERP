---
# Automated PostgreSQL backup playbook for Pharmaviyum-CRM

- name: Backup PostgreSQL and manage retention
  hosts: pharmacy_servers
  become: true
  gather_facts: true

  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ app_directory }}/backups"
        state: directory
        owner: "{{ deploy_user }}"
        mode: "0750"

    - name: Generate timestamp for backup file
      ansible.builtin.set_fact:
        backup_ts: "{{ ansible_date_time.iso8601_basic_short }}"

    - name: Create compressed PostgreSQL dump
      ansible.builtin.shell: >
        set -o pipefail &&
        docker compose -f {{ app_directory }}/docker-compose.yml
        exec -T db pg_dump -U {{ postgres_user }} -d {{ postgres_db }}
        | gzip > "{{ app_directory }}/backups/pharmaviyum_{{ backup_ts }}.sql.gz"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Find old backups
      ansible.builtin.find:
        paths: "{{ app_directory }}/backups"
        patterns: "pharmaviyum_*.sql.gz"
        age: "{{ backup_retention_days }}d"
      register: old_backups

    - name: Delete expired backup files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"

    - name: Schedule daily backup via cron
      ansible.builtin.cron:
        name: "Pharmaviyum DB Backup"
        minute: "0"
        hour: "2"
        job: "ansible-playbook /opt/ansible/playbooks/backup.yml
              --vault-password-file /opt/ansible/vault.key"
        user: root
      when: backup_enabled | bool
