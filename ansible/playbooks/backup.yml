---
- name: Backup Pharmaviyum PostgreSQL
  hosts: pharmacy_servers
  become: true
  gather_facts: true
  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ app_directory }}/backups"
        state: directory
        owner: "{{ deploy_user }}"
        mode: "0750"

    - name: Create compressed PostgreSQL backup
      community.docker.docker_compose_v2_exec:
        project_src: "{{ app_directory }}"
        service: db
        command: >-
          sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > /backups/pharmaviyum_{{ ansible_date_time.iso8601_basic_short }}.sql.gz'
      register: backup_result
      changed_when: true

    - name: Find expired backups
      ansible.builtin.find:
        paths: "{{ app_directory }}/backups"
        patterns: "pharmaviyum_*.sql.gz"
        age: "{{ backup_retention_days }}d"
      register: old_backups

    - name: Remove expired backups
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"

    - name: Verify at least one backup exists
      ansible.builtin.find:
        paths: "{{ app_directory }}/backups"
        patterns: "pharmaviyum_*.sql.gz"
      register: backups
      failed_when: backups.matched < 1
