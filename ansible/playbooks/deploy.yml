---
- name: Validate selected pharmacy fleet before contacting remote hosts
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Require at least one selected pharmacy Edge
      ansible.builtin.assert:
        that:
          - groups['pharmacy_servers'] is defined
          - groups['pharmacy_servers'] | length >= 1
        fail_msg: "The selected inventory must contain at least one pharmacy Edge host."

    - name: Enforce the configured 1–10 starter rollout limit
      ansible.builtin.assert:
        that:
          - groups['pharmacy_servers'] | length <= (active_rollout_limit | int)
          - groups['pharmacy_servers'] | length <= (max_supported_pharmacy_sites | int)
        fail_msg: >-
          The currently enabled Ansible rollout supports up to {{ active_rollout_limit }} pharmacy Edge sites.
          The long-term architecture target is {{ max_supported_pharmacy_sites }} sites;
          larger rollouts remain disabled.

    - name: Require immutable application release
      ansible.builtin.assert:
        that:
          - app_version is defined
          - app_version | string | length > 0
          - app_version != "latest"
        fail_msg: "app_version must be an immutable release tag, never latest."

    - name: Require database credential
      ansible.builtin.assert:
        that:
          - postgres_password is defined
          - postgres_password | string | length > 0
        fail_msg: "PHARMAVIYUM_POSTGRES_PASSWORD must be set."

- name: Validate each Edge host before deployment
  hosts: pharmacy_servers
  become: false
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Require explicit Edge site and SSH identity
      ansible.builtin.assert:
        that:
          - pharmacy_id is defined
          - pharmacy_id | string | length > 0
          - site_code is defined
          - site_code | string | length > 0
          - ansible_host is defined
          - ansible_host | string | length > 0
          - ansible_user is defined
          - ansible_user | string | length > 0
        fail_msg: >-
          Every production Edge must define a real host address, SSH user,
          pharmacy_id and site_code. Localhost/default identity fallbacks are forbidden.

    - name: Check Docker availability
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Check Compose availability
      ansible.builtin.command: docker compose version
      changed_when: false

- name: Deploy Pharmaviyum one pharmacy at a time
  hosts: pharmacy_servers
  serial: 1
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: docker
      tags: [docker, infrastructure]
    - role: postgresql
      tags: [database, infrastructure]
    - role: app-backend
      tags: [backend, application]

- name: Verify deployment
  hosts: pharmacy_servers
  become: false
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Check backend health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ backend_port }}/health"
        status_code: 200
        timeout: 10
      register: health
      retries: 12
      delay: 5
      until: health.status == 200

    - name: Show deployed release
      ansible.builtin.debug:
        msg: "Pharmaviyum {{ app_version }} is healthy on {{ inventory_hostname }}"
