---
- name: Validate deployment inputs
  hosts: pharmacy_servers
  become: false
  gather_facts: true
  tasks:
    - name: Require immutable application version
      ansible.builtin.assert:
        that:
          - app_version is defined
          - app_version | length > 0
          - app_version != "latest"
        fail_msg: "app_version must be an immutable release tag, never latest."

    - name: Require database password
      ansible.builtin.assert:
        that:
          - postgres_password is defined
          - postgres_password | length > 0
        fail_msg: "PHARMAVIYUM_POSTGRES_PASSWORD must be set."

    - name: Require Edge sync configuration to be all enabled or all disabled
      ansible.builtin.assert:
        that:
          - >-
            (pharmaviyum_edge_node_id | default('') | length == 0
            and pharmaviyum_edge_token | default('') | length == 0
            and pharmaviyum_central_sync_url | default('') | length == 0)
            or
            (pharmaviyum_edge_node_id | default('') | length > 0
            and pharmaviyum_edge_token | default('') | length > 0
            and pharmaviyum_central_sync_url | default('') | length > 0)
        fail_msg: "Configure Edge node ID, token and Central URL together, or leave all three empty."

    - name: Validate enabled Edge sync credentials and HTTPS endpoint
      ansible.builtin.assert:
        that:
          - pharmaviyum_edge_node_id is match('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$')
          - pharmaviyum_edge_token | length >= 32
          - pharmaviyum_central_sync_url is match('^https://[^/]+(/.*)?$')
        fail_msg: "Edge sync requires a valid UUID, a high-entropy token and an HTTPS Central URL."
      no_log: true
      when: pharmaviyum_edge_node_id | default('') | length > 0

    - name: Check Docker availability
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Check Compose availability
      ansible.builtin.command: docker compose version
      changed_when: false

- name: Deploy Pharmaviyum
  hosts: pharmacy_servers
  become: true
  gather_facts: true
  roles:
    - role: docker
      tags: [docker, infrastructure]
    - role: postgresql
      tags: [database, infrastructure]
    - role: app-backend
      tags: [backend, application]

- name: Verify deployment
  hosts: pharmacy_servers
  become: false
  gather_facts: false
  tasks:
    - name: Check backend health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ backend_port }}/health"
        status_code: 200
        timeout: 10
      register: health
      retries: 12
      delay: 5
      until: health.status == 200

    - name: Show deployed release
      ansible.builtin.debug:
        msg: "Pharmaviyum {{ app_version }} is healthy on {{ inventory_hostname }}"
