---
- name: Validate deployment inputs
  hosts: pharmacy_servers
  become: false
  gather_facts: true
  tasks:
    - name: Require a starter fleet of one to ten pharmacy Edge sites
      ansible.builtin.assert:
        that:
          - groups['pharmacy_servers'] | length >= 1
          - groups['pharmacy_servers'] | length <= 10
        fail_msg: >-
          The starter Ansible profile supports 1–10 pharmacy Edge sites.
          Split larger fleets into an explicitly approved rollout profile.

    - name: Require explicit Edge site identity
      ansible.builtin.assert:
        that:
          - pharmacy_id is defined
          - pharmacy_id | string | length > 0
          - site_code is defined
          - site_code | string | length > 0
          - ansible_host is defined
          - ansible_host | string | length > 0
          - ansible_user is defined
          - ansible_user | string | length > 0
        fail_msg: >-
          Every production Edge must define a real host address, SSH user, pharmacy_id
          and site_code. Localhost/default identity fallbacks are forbidden.

    - name: Require immutable application version
      ansible.builtin.assert:
        that:
          - app_version is defined
          - app_version | length > 0
          - app_version != "latest"
        fail_msg: "app_version must be an immutable release tag, never latest."

    - name: Require database password
      ansible.builtin.assert:
        that:
          - postgres_password is defined
          - postgres_password | length > 0
        fail_msg: "PHARMAVIYUM_POSTGRES_PASSWORD must be set."

    - name: Check Docker availability
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Check Compose availability
      ansible.builtin.command: docker compose version
      changed_when: false

- name: Deploy Pharmaviyum one pharmacy at a time
  hosts: pharmacy_servers
  serial: 1
  become: true
  gather_facts: true
  roles:
    - role: docker
      tags: [docker, infrastructure]
    - role: postgresql
      tags: [database, infrastructure]
    - role: app-backend
      tags: [backend, application]

- name: Verify deployment
  hosts: pharmacy_servers
  become: false
  gather_facts: false
  tasks:
    - name: Check backend health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ backend_port }}/health"
        status_code: 200
        timeout: 10
      register: health
      retries: 12
      delay: 5
      until: health.status == 200

    - name: Show deployed release
      ansible.builtin.debug:
        msg: "Pharmaviyum {{ app_version }} is healthy on {{ inventory_hostname }}"
