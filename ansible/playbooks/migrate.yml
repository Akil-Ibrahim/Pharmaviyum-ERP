---
# Run this playbook as an explicit release gate before deploy.yml.
# Example:
# ansible-playbook -i inventory/lab/hosts.yml playbooks/migrate.yml \
#   --limit pharmacy-edge-lab-01 -e migration_approved=true \
#   -e migration_approval_reference=CHG-1234

- name: Validate selected migration fleet before contacting pharmacy hosts
  hosts: pharmacy_servers
  connection: local
  gather_facts: false
  any_errors_fatal: true
  max_fail_percentage: 0
  tags: [preflight]
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Enforce the 100-site architecture inventory ceiling
      ansible.builtin.assert:
        that:
          - groups['pharmacy_servers'] is defined
          - groups['pharmacy_servers'] | length >= 1
          - groups['pharmacy_servers'] | length <= (max_supported_pharmacy_sites | int)
        fail_msg: >-
          The migration inventory must contain between 1 and
          {{ max_supported_pharmacy_sites }} pharmacy sites. The 100-site
          value is an architecture ceiling, not an active rollout size.
      run_once: true
      delegate_to: localhost

    - name: Enforce the active migration rollout limit against selected hosts
      ansible.builtin.assert:
        that:
          - active_rollout_limit | int >= 1
          - active_rollout_limit | int <= (max_supported_pharmacy_sites | int)
          - ansible_play_hosts_all | length >= 1
          - ansible_play_hosts_all | length <= (active_rollout_limit | int)
        fail_msg: >-
          The active migration rollout limit must be between 1 and
          {{ max_supported_pharmacy_sites }}. This run selected
          {{ ansible_play_hosts_all | length }} pharmacy hosts, but the
          active limit is {{ active_rollout_limit }}.
      run_once: true
      delegate_to: localhost

    - name: Require non-empty pharmacy IDs across the complete inventory
      ansible.builtin.assert:
        that:
          - hostvars[item].pharmacy_id is defined
          - hostvars[item].pharmacy_id | string | length > 0
        fail_msg: "Every inventory pharmacy must define a non-empty pharmacy_id."
      loop: "{{ groups['pharmacy_servers'] }}"
      run_once: true
      delegate_to: localhost

    - name: Require globally unique pharmacy IDs
      ansible.builtin.assert:
        that:
          - >-
            (groups['pharmacy_servers']
            | map('extract', hostvars, 'pharmacy_id')
            | list | unique | list | length)
            == (groups['pharmacy_servers'] | length)
        fail_msg: "Every pharmacy in the complete inventory must have a unique pharmacy_id."
      run_once: true
      delegate_to: localhost

    - name: Require non-empty site codes across the complete inventory
      ansible.builtin.assert:
        that:
          - hostvars[item].site_code is defined
          - hostvars[item].site_code | string | length > 0
        fail_msg: "Every inventory pharmacy must define a non-empty site_code."
      loop: "{{ groups['pharmacy_servers'] }}"
      run_once: true
      delegate_to: localhost

    - name: Require globally unique site codes
      ansible.builtin.assert:
        that:
          - >-
            (groups['pharmacy_servers']
            | map('extract', hostvars, 'site_code')
            | list | unique | list | length)
            == (groups['pharmacy_servers'] | length)
        fail_msg: "Every pharmacy in the complete inventory must have a unique site_code."
      run_once: true
      delegate_to: localhost

    - name: Validate SSH endpoint and user for selected migration hosts
      ansible.builtin.assert:
        that:
          - hostvars[item].ansible_host is defined
          - hostvars[item].ansible_host | string | length > 0
          - hostvars[item].ansible_user is defined
          - hostvars[item].ansible_user | string | length > 0
        fail_msg: "Every selected migration target requires a real SSH endpoint and SSH user."
      loop: "{{ ansible_play_hosts_all }}"
      run_once: true
      delegate_to: localhost

    - name: Require a non-empty database credential for every selected pharmacy
      ansible.builtin.assert:
        that:
          - hostvars[item].postgres_password is defined
          - hostvars[item].postgres_password | string | length > 0
        fail_msg: "Each selected pharmacy must provide its own PostgreSQL credential."
      no_log: true
      loop: "{{ ansible_play_hosts_all }}"
      run_once: true
      delegate_to: localhost

    - name: Require unique configured PostgreSQL credentials across inventory
      ansible.builtin.assert:
        that:
          - >-
            (groups['pharmacy_servers']
            | map('extract', hostvars)
            | map(attribute='postgres_password', default='')
            | select | list | unique | list | length)
            ==
            (groups['pharmacy_servers']
            | map('extract', hostvars)
            | map(attribute='postgres_password', default='')
            | select | list | length)
        fail_msg: "Every configured PostgreSQL credential must be unique across the complete inventory."
      no_log: true
      run_once: true
      delegate_to: localhost

- name: Apply an explicitly approved, backed-up Edge database migration
  hosts: pharmacy_servers
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    migration_approved: false
    migration_approval_reference: ""
    migration_work_dir: "{{ app_directory }}/.migration-{{ inventory_hostname }}"

  pre_tasks:
    - name: Require explicit migration approval and change reference
      ansible.builtin.assert:
        that:
          - migration_approved | bool
          - migration_approval_reference | string | length > 0
        fail_msg: >-
          Database migrations are disabled by default. Pass
          -e migration_approved=true and a change/approval reference.

    - name: Require immutable release image and database credentials
      ansible.builtin.assert:
        that:
          - backend_image_digest is match('^sha256:[0-9a-f]{64}  tasks:
    - name: Ensure application and backup directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ deploy_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ app_directory }}", mode: "0750" }
        - { path: "{{ app_directory }}/backups", mode: "0700" }

    - name: Stage migration release, verify backup and apply schema change
      block:
        - name: Create isolated migration work directory
          ansible.builtin.file:
            path: "{{ migration_work_dir }}"
            state: directory
            owner: "{{ deploy_user }}"
            mode: "0700"

        - name: Render isolated migration environment
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/app-backend/templates/app.env.j2"
            dest: "{{ migration_work_dir }}/.env"
            owner: "{{ deploy_user }}"
            mode: "0600"
          no_log: true

        - name: Install isolated migration Compose definition
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../roles/app-backend/files/docker-compose-backend.yml"
            dest: "{{ migration_work_dir }}/docker-compose.yml"
            owner: "{{ deploy_user }}"
            mode: "0600"

        - name: Authenticate to the container registry
          community.docker.docker_login:
            registry_url: "{{ container_registry }}"
            username: "{{ ghcr_username }}"
            password: "{{ ghcr_token }}"
          no_log: true
          when:
            - ghcr_username | default('') | length > 0
            - ghcr_token | default('') | length > 0

        - name: Pull the exact immutable release image
          community.docker.docker_image:
            name: "{{ backend_image }}@{{ backend_image_digest }}"
            source: pull

        - name: Start only PostgreSQL and cache dependencies in the existing project
          community.docker.docker_compose_v2:
            project_src: "{{ migration_work_dir }}"
            project_name: "{{ docker_compose_project }}"
            services:
              - db
              - redis
            state: present

        - name: Wait for PostgreSQL to accept connections
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - "{{ docker_compose_project }}"
              - --env-file
              - "{{ migration_work_dir }}/.env"
              - -f
              - "{{ migration_work_dir }}/docker-compose.yml"
              - exec
              - -T
              - db
              - pg_isready
              - -U
              - "{{ postgres_user }}"
              - -d
              - "{{ postgres_db }}"
          register: postgres_ready
          changed_when: false
          retries: 12
          delay: 5
          until: postgres_ready.rc == 0

        - name: Generate a unique pre-migration backup name
          ansible.builtin.set_fact:
            migration_backup_file: >-
              {{ app_directory }}/backups/pre-migration-{{ inventory_hostname }}-{{ ansible_date_time.iso8601_basic_short }}.sql.gz

        - name: Create a compressed database backup before migration
          ansible.builtin.shell: >-
            set -o pipefail &&
            docker compose
            --project-name "{{ docker_compose_project }}"
            --env-file "{{ migration_work_dir }}/.env"
            -f "{{ migration_work_dir }}/docker-compose.yml"
            exec -T db pg_dump -U "{{ postgres_user }}" -d "{{ postgres_db }}"
            | gzip -c > "{{ migration_backup_file }}"
          args:
            executable: /bin/bash
          changed_when: true
          no_log: true

        - name: Set restrictive ownership and permissions on the backup
          ansible.builtin.file:
            path: "{{ migration_backup_file }}"
            owner: "{{ deploy_user }}"
            mode: "0600"

        - name: Inspect the generated backup file
          ansible.builtin.stat:
            path: "{{ migration_backup_file }}"
          register: migration_backup_stat

        - name: Require a non-empty pre-migration backup
          ansible.builtin.assert:
            that:
              - migration_backup_stat.stat.exists
              - migration_backup_stat.stat.size | int > 0
            fail_msg: "The pre-migration backup is missing or empty; refusing to run Alembic."

        - name: Verify the pre-migration backup archive
          ansible.builtin.command:
            argv:
              - gzip
              - -t
              - "{{ migration_backup_file }}"
          changed_when: false

        - name: Record backup checksum
          ansible.builtin.command:
            argv:
              - sha256sum
              - "{{ migration_backup_file }}"
          register: migration_backup_checksum
          changed_when: false

        - name: Run Alembic migration using the pinned release image
          community.docker.docker_compose_v2_run:
            project_src: "{{ migration_work_dir }}"
            project_name: "{{ docker_compose_project }}"
            service: backend
            command: alembic upgrade head
            no_deps: true
            remove_orphans: true
            cleanup: true
          register: migration_result

      always:
        - name: Remove staged migration environment and Compose files
          ansible.builtin.file:
            path: "{{ migration_work_dir }}"
            state: absent

    - name: Report migration audit metadata
      ansible.builtin.debug:
        msg:
          - "Migration approved under {{ migration_approval_reference }}."
          - "Release: {{ app_version }} ({{ backend_image_digest }})."
          - "Pre-migration backup: {{ migration_backup_file }}."
          - "Backup SHA-256: {{ migration_backup_checksum.stdout.split()[0] }}."
)
          - postgres_password | string | length > 0
          - app_version | string | length > 0
          - app_version != 'latest'
        fail_msg: "An immutable release, image digest and per-site DB credential are required."
      no_log: true

    - name: Gather Edge facts only after explicit migration approval
      ansible.builtin.setup:

  tasks:
    - name: Ensure application and backup directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ deploy_user }}"
        mode: "{{ item.mode }}"
