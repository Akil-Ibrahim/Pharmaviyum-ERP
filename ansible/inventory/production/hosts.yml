---
all:
  children:
    pharmacy_servers:
      hosts:
        pharmacy-server-01:
          # No localhost fallback: missing connection details must fail preflight.
          ansible_host: "{{ lookup('env', 'PHARMAVIYUM_ONPREM_HOST') }}"
          ansible_user: "{{ lookup('env', 'PHARMAVIYUM_ONPREM_USER') }}"
          pharmacy_id: "{{ lookup('env', 'PHARMAVIYUM_PHARMACY_ID') }}"
          site_code: "{{ lookup('env', 'PHARMAVIYUM_SITE_CODE') }}"
      vars:
        app_environment: production
        debug_mode: false
        deploy_user: pharmaviyum
        app_directory: /opt/pharmaviyum
        docker_compose_project: pharmaviyum
        backend_port: 8000
        postgres_db: pharmaviyum
        postgres_user: app_user
        backup_enabled: true
