---
all:
  children:
    pharmacy_servers:
      hosts:
        pharmacy-server-01:
          ansible_host: "{{ lookup('env', 'PHARMAVIYUM_ONPREM_HOST') | default('127.0.0.1', true) }}"
          ansible_user: "{{ lookup('env', 'PHARMAVIYUM_ONPREM_USER') | default('pharmaviyum', true) }}"
      vars:
        app_environment: production
        debug_mode: false
        deploy_user: pharmaviyum
        app_directory: /opt/pharmaviyum
        docker_compose_project: pharmaviyum
        backend_port: 8000
        nginx_http_port: 80
        nginx_https_port: 443
        postgres_db: pharmaviyum
        postgres_user: app_user
        backup_enabled: true
