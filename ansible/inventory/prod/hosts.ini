# =============================================================================
# Pharmaviyum-CRM - Local Development Inventory
# For testing in Codespaces/GitHub Codespaces
# =============================================================================

[pharmacy_servers]
localhost ansible_connection=local

[mortarium_ai_servers]
localhost

[all:vars]
ansible_python_interpreter=auto_silent
deploy_user=codespace
app_directory=/home/codespace/pharmaviyum
docker_compose_project=pharmaviyum
backend_port=8000
mortarium_port=8001
nginx_http_port=80
nginx_https_port=443
postgres_user=app_user
postgres_db=pharmaviyum
postgres_port=5432
backup_enabled=true
backup_retention_days=7
app_environment=development
debug_mode=true
