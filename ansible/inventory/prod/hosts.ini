# Production inventory for Pharmaviyum-CRM deployment
# Target: On-premise pharmacy computers in Southeast Asia

[pharmacy_servers]
# Replace with actual server IPs or hostnames
pharmacy-01 ansible_host=192.168.1.100 ansible_user=deploy
pharmacy-02 ansible_host=192.168.1.101 ansible_user=deploy

[mortarium_ai_servers]
# Separate group for RAG service nodes (can be same as above)
pharmacy-01
pharmacy-02

[all:vars]
# Global variables for all hosts
ansible_python_interpreter=/usr/bin/python3
deploy_user=deploy
app_directory=/opt/pharmaviyum
docker_compose_project=pharmaviyum
