---
# Example lab inventory only. Set the three PHARMAVIYUM_LAB_* environment
# variables before running Ansible. Never point this inventory at a live site.
all:
  children:
    pharmacy_servers:
      hosts:
        pharmacy-edge-lab-01:
          ansible_host: "{{ lookup('env', 'PHARMAVIYUM_LAB_EDGE_HOST') }}"
          ansible_user: "{{ lookup('env', 'PHARMAVIYUM_LAB_EDGE_USER') }}"
          pharmacy_id: "lab-pharmacy-001"
          site_code: "LAB-001"
      vars:
        app_environment: staging
        debug_mode: false
        deploy_user: pharmaviyum
        app_directory: /opt/pharmaviyum
        docker_compose_project: pharmaviyum
        backend_port: 8000
        postgres_db: pharmaviyum
        postgres_user: app_user
        backup_enabled: true
        starter_max_pharmacies: 10
