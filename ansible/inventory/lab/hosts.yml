---
# Isolated lab inventory. Never point this file at a live pharmacy.
all:
  children:
    pharmacy_servers:
      hosts:
        pharmacy-edge-lab-01:
          ansible_host: "{{ lookup('env', 'PHARMAVIYUM_LAB_EDGE_HOST') }}"
          ansible_user: "{{ lookup('env', 'PHARMAVIYUM_LAB_EDGE_USER') }}"
          pharmacy_id: "lab-pharmacy-001"
          site_code: "LAB-001"
          postgres_password: "{{ lookup('env', 'PHARMAVIYUM_LAB_POSTGRES_PASSWORD') }}"
          # Sync remains disabled in lab until all three values are supplied.
          pharmaviyum_edge_node_id: ""
          pharmaviyum_edge_token: ""
          pharmaviyum_central_sync_url: ""
      vars:
        app_environment: staging
        debug_mode: false
        deploy_user: pharmaviyum
        app_directory: /opt/pharmaviyum
        docker_compose_project: pharmaviyum
        backend_port: 8000
        postgres_db: pharmaviyum
        postgres_user: app_user
        backup_enabled: true
