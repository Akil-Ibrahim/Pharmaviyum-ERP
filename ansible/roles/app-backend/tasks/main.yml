---
- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    owner: "{{ deploy_user }}"
    mode: "0750"

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "{{ app_directory }}/backups"
    state: directory
    owner: "{{ deploy_user }}"
    mode: "0750"

- name: Render application environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_directory }}/.env"
    owner: "{{ deploy_user }}"
    mode: "0600"
  no_log: true
  notify: Restart application

- name: Deploy Compose definition
  ansible.builtin.copy:
    src: docker-compose-backend.yml
    dest: "{{ app_directory }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    mode: "0644"
  notify: Restart application

- name: Log in to GHCR
  community.docker.docker_login:
    registry_url: "{{ container_registry }}"
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"
  no_log: true
  when:
    - ghcr_username | default('') | length > 0
    - ghcr_token | default('') | length > 0

- name: Pull immutable application image
  community.docker.docker_image:
    name: "{{ backend_image }}:{{ app_version }}"
    source: pull

- name: Start database and cache
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    project_name: "{{ docker_compose_project }}"
    services:
      - db
      - redis
    state: present

- name: Run database migrations
  community.docker.docker_compose_v2_run:
    project_src: "{{ app_directory }}"
    service: backend
    command: alembic upgrade head
    remove_orphans: true
    cleanup: true
  register: migration_result

- name: Start backend
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    project_name: "{{ docker_compose_project }}"
    services:
      - backend
      - celery-worker
      - celery-beat
    state: present
    pull: missing
