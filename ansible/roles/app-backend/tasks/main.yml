---
- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    owner: "{{ deploy_user }}"
    mode: "0755"

- name: Copy src directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../src"
    dest: "{{ app_directory }}/src"
    owner: "{{ deploy_user }}"
    mode: "0755"
    force: true

- name: Copy mortarium-ai directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../mortarium-ai"
    dest: "{{ app_directory }}/mortarium-ai"
    owner: "{{ deploy_user }}"
    mode: "0755"
    force: true

- name: Copy nginx directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../nginx"
    dest: "{{ app_directory }}/nginx"
    owner: "{{ deploy_user }}"
    mode: "0755"
    force: true

- name: Copy docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker-compose.yml"
    dest: "{{ app_directory }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    mode: "0644"
    force: true

- name: Copy Dockerfile from root
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../Dockerfile"
    dest: "{{ app_directory }}/Dockerfile"
    owner: "{{ deploy_user }}"
    mode: "0644"
    force: true

- name: Copy requirements.txt
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../requirements.txt"
    dest: "{{ app_directory }}/requirements.txt"
    owner: "{{ deploy_user }}"
    mode: "0644"
    force: true

- name: Deploy via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    project_name: "{{ docker_compose_project }}"
    state: present
    build: always
    pull: always
