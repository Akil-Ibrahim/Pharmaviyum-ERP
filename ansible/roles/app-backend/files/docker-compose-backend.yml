# Docker Compose for Pharmaviyum-CRM Backend
# FastAPI + PostgreSQL + Redis stack

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: pharmaviyum-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmaviyum}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-pharmaviyum}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmaviyum-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pharmaviyum-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmaviyum-network

  # FastAPI Backend
  backend:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: pharmaviyum-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-pharmaviyum}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pharmaviyum-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  pharmaviyum-network:
    driver: bridge
