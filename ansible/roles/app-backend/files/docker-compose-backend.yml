services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmaviyum}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-pharmaviyum}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [pharmaviyum-network]

  redis:
    image: ${REDIS_IMAGE:-valkey/valkey:8-alpine}
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [pharmaviyum-network]

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmaviyum}
      PGVECTOR_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmaviyum}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [pharmaviyum-network]

  celery-worker:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmaviyum}
      PGVECTOR_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmaviyum}
      REDIS_URL: redis://redis:6379/0
      PHARMAVIYUM_EDGE_NODE_ID: ${PHARMAVIYUM_EDGE_NODE_ID:-}
      PHARMAVIYUM_EDGE_TOKEN: ${PHARMAVIYUM_EDGE_TOKEN:-}
      PHARMAVIYUM_CENTRAL_SYNC_URL: ${PHARMAVIYUM_CENTRAL_SYNC_URL:-}
      PHARMAVIYUM_SYNC_BATCH_SIZE: ${PHARMAVIYUM_SYNC_BATCH_SIZE:-50}
      PHARMAVIYUM_SYNC_LEASE_SECONDS: ${PHARMAVIYUM_SYNC_LEASE_SECONDS:-30}
      PHARMAVIYUM_SYNC_HTTP_TIMEOUT_SECONDS: ${PHARMAVIYUM_SYNC_HTTP_TIMEOUT_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      celery -A src.pharmaviyum.ai.mortarium_rag.ingestion.celery_app worker
      --loglevel=info --concurrency=2 --queues=ingestion,maintenance
    networks: [pharmaviyum-network]

  celery-beat:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmaviyum}
      PGVECTOR_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmaviyum}
      REDIS_URL: redis://redis:6379/0
      PHARMAVIYUM_EDGE_NODE_ID: ${PHARMAVIYUM_EDGE_NODE_ID:-}
      PHARMAVIYUM_EDGE_TOKEN: ${PHARMAVIYUM_EDGE_TOKEN:-}
      PHARMAVIYUM_CENTRAL_SYNC_URL: ${PHARMAVIYUM_CENTRAL_SYNC_URL:-}
      PHARMAVIYUM_SYNC_BATCH_SIZE: ${PHARMAVIYUM_SYNC_BATCH_SIZE:-50}
      PHARMAVIYUM_SYNC_LEASE_SECONDS: ${PHARMAVIYUM_SYNC_LEASE_SECONDS:-30}
      PHARMAVIYUM_SYNC_HTTP_TIMEOUT_SECONDS: ${PHARMAVIYUM_SYNC_HTTP_TIMEOUT_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      celery -A src.pharmaviyum.ai.mortarium_rag.ingestion.celery_app beat
      --loglevel=info
    networks: [pharmaviyum-network]

volumes:
  postgres_data:
  redis_data:

networks:
  pharmaviyum-network:
    driver: bridge
