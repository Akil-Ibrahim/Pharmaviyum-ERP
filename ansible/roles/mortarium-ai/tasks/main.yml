---
# =============================================================================
# Mortarium AI Role - Deploy RAG service with Qwen3-8B LLM
# =============================================================================

- name: Ensure AI model directory exists
  ansible.builtin.file:
    path: "{{ ai_model_path | dirname }}"
    state: directory
    owner: "{{ deploy_user }}"
    mode: "0755"

- name: Ensure vector store directory exists
  ansible.builtin.file:
    path: "{{ ai_vector_store_path }}"
    state: directory
    owner: "{{ deploy_user }}"
    mode: "0755"

- name: Deploy Mortarium AI via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    project_name: "{{ docker_compose_project }}"
    state: present
    services:
      - mortarium-ai
    build: always
    pull: always
  register: ai_compose_result

- name: Log AI deployment result
  ansible.builtin.debug:
    msg: "Mortarium AI deployed: {{ ai_compose_result.services | default('unknown') }}"
