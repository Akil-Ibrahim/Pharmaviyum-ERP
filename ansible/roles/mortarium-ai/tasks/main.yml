---
# Deploy Mortarium AI RAG service
# Handles model paths, env configuration, and container startup

- name: Create Mortarium AI directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    mode: "0755"
  loop:
    - "{{ app_directory }}/mortarium"
    - "{{ app_directory }}/models"
    - "{{ app_directory }}/data/vector_store"

- name: Deploy Mortarium AI docker-compose configuration
  ansible.builtin.copy:
    src: files/docker-compose-mortarium.yml
    dest: "{{ app_directory }}/docker-compose-mortarium.yml"
    mode: "0644"

- name: Write Mortarium .env from vaulted variable
  ansible.builtin.copy:
    content: "{{ vault_mortarium_env }}"
    dest: "{{ app_directory }}/mortarium/.env"
    mode: "0600"
    owner: "{{ deploy_user }}"

- name: Validate model file existence
  ansible.builtin.stat:
    path: "{{ mortarium_model_path }}"
  register: model_check

- name: Warn if RAG model is missing
  ansible.builtin.debug:
    msg: "⚠️ Model not found at {{ mortarium_model_path }}. Place it manually before first run."
  when: not model_check.stat.exists

- name: Start Mortarium AI container
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    project_name: mortarium
    state: present
    build: true
    pull: missing
    services: ["mortarium-ai"]
    remove_orphans: true
