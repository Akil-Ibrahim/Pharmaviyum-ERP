[defaults]
# Disable host key checking for automated deployments (use with caution in production)
host_key_checking = False
# Use YAML format for inventory files
inventory = ./inventory
# Enable fact caching for faster playbook execution
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
# Show task timing for performance analysis
task_timeout = 30
# Use YAML for callback output
stdout_callback = yaml
# Enable additional callbacks for debugging
callbacks_enabled = profile_tasks, timer

[privilege_escalation]
# Allow sudo without password prompt for deployment tasks
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Optimize SSH for faster file transfers
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
