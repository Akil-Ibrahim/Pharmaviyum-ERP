services:
  api:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: pharmaviyum-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PGVECTOR_DATABASE_URL: ${PGVECTOR_DATABASE_URL:?PGVECTOR_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-qwen2.5:1.5b}
      OLLAMA_MAIN_MODEL: ${OLLAMA_MAIN_MODEL:-qwen2.5:7b}
      OLLAMA_COMPLEX_MODEL: ${OLLAMA_COMPLEX_MODEL:-qwen2.5:72b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large}
      LANGSMITH_ENABLED: ${LANGSMITH_ENABLED:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-pharmaviyum-staging}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  migration:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PGVECTOR_DATABASE_URL: ${PGVECTOR_DATABASE_URL:?PGVECTOR_DATABASE_URL is required}
    command: ["alembic", "upgrade", "head"]
    profiles: ["migration"]
