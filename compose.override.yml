# Development overrides (auto-applied in dev)
services:
  backend:
    volumes:
      - ./src:/app/src
    environment:
      DEBUG: "true"
      LOG_LEVEL: "DEBUG"
  
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
  
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pharmaviyum.com
      PGADMIN_DEFAULT_PASSWORD: admin
