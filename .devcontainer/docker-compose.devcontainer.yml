services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    tty: true
    privileged: true
    working_dir: /workspaces/Pharmaviyum-ERP
    volumes:
      - ..:/workspaces/Pharmaviyum-ERP:cached
      - uv_cache:/home/vscode/.cache/uv
      - npm_cache:/home/vscode/.npm
    command: sleep infinity
    environment:
      UV_LINK_MODE: copy
      PYTHONPATH: /workspaces/Pharmaviyum-ERP/src
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pharmaviyum
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      LOG_LEVEL: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmaviyum
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_pg18:/var/lib/postgresql
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmaviyum"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_pg18:
  redis_data:
  uv_cache:
  npm_cache:
