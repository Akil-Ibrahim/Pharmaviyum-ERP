[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires Redis/PostgreSQL)
    e2e: End-to-end tests (full stack)
    slow: Slow tests (>1 second)

# Async support
asyncio_mode = auto
