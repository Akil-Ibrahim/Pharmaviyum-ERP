services:
  - type: web
    name: pharmaviyum-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: dev
    plan: free
    autoDeployTrigger: checksPass
    # Both staging and production run Alembic migrations in their Docker startup contract.
    dockerCommand: >-
      sh -c 'alembic upgrade head &&
      if [ "${SEED_DEMO_DATA:-false}" = "true" ]; then
      python scripts/seed_database.py; fi &&
      exec uvicorn src.pharmaviyum.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: API_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pharmaviyum-postgres
          property: connectionString
      - key: PGVECTOR_DATABASE_URL
        fromDatabase:
          name: pharmaviyum-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pharmaviyum-redis
          property: connectionString
      - key: USE_CLOUD_LLM
        value: "true"
      - key: CLOUD_LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_COMPLEX_MODEL
        value: gemini-2.5-pro
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "1024"

  - type: keyvalue
    name: pharmaviyum-redis
    plan: free
    ipAllowList: []

databases:
  - name: pharmaviyum-postgres
    databaseName: pharmaviyum
    user: pharmaviyum
    postgresMajorVersion: "16"
    plan: free
    ipAllowList: []
