services:
  - type: web
    name: pharmaviyum-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: dev
    plan: free
    autoDeployTrigger: checksPass
    # Render's preDeployCommand is paid-only; staging keeps the migration
    # explicitly in its start command. Production uses deploy/docker-compose.release.yml
    # with a separate migration service.
    dockerCommand: >-
      sh -c 'alembic upgrade head &&
      if [ "${SEED_DEMO_DATA:-false}" = "true" ]; then
      python scripts/seed_database.py; fi &&
      exec uvicorn src.pharmaviyum.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: API_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pharmaviyum-postgres
          property: connectionString
      - key: PGVECTOR_DATABASE_URL
        fromDatabase:
          name: pharmaviyum-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pharmaviyum-redis
          property: connectionString
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_FAST_MODEL
        value: qwen2.5:1.5b
      - key: OLLAMA_MAIN_MODEL
        value: qwen2.5:7b
      - key: OLLAMA_COMPLEX_MODEL
        value: qwen2.5:72b
      - key: OLLAMA_EMBEDDING_MODEL
        value: mxbai-embed-large

  - type: keyvalue
    name: pharmaviyum-redis
    plan: free
    ipAllowList: []

databases:
  - name: pharmaviyum-postgres
    databaseName: pharmaviyum
    user: pharmaviyum
    postgresMajorVersion: "16"
    plan: free
    ipAllowList: []
