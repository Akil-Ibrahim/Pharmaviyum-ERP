name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.14.7'
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: pharmaviyum_test
  IMAGE_NAME: pharmaviyum-crm
  IMAGE_REPOSITORY: ghcr.io/akil-ibrahim/pharmaviyum-crm

permissions:
  contents: read

concurrency:
  group: pharmaviyum-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, Format and Types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen
      - name: Ruff diagnostics
        run: uv run ruff check src/ tests/
      - name: Black diagnostics
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            FILES="$(git diff --name-only "origin/${GITHUB_BASE_REF}...${GITHUB_SHA}" -- src/ tests/ | grep -E "[.]py$" || true)"
            if [ -z "$FILES" ]; then
              echo "No Python files changed in this pull request; skipping Black."
            else
              printf '%s\n' "$FILES" | xargs uv run black --check --diff
            fi
          else
            uv run black --check --diff src/ tests/
          fi
      - name: isort diagnostics
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            FILES="$(git diff --name-only "origin/${GITHUB_BASE_REF}...${GITHUB_SHA}" -- src/ tests/ | grep -E "[.]py$" || true)"
            if [ -z "$FILES" ]; then
              echo "No Python files changed in this pull request; skipping isort."
            else
              printf '%s\n' "$FILES" | xargs uv run isort --check-only --diff --profile black
            fi
          else
            uv run isort --check-only --diff --profile black src/ tests/
          fi
      - name: mypy diagnostics
        run: uv run mypy --explicit-package-bases src/pharmaviyum/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install uv
      - run: uv sync --frozen
      - name: Unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmaviyum_test
          PGVECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmaviyum_test
          REDIS_URL: redis://localhost:6379/15
          ENVIRONMENT: development
        run: uv run pytest tests/unit/ -v -m unit --cov=src/pharmaviyum --cov-report=xml --cov-report=term-missing

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install uv
      - run: uv sync --frozen
      - name: Integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmaviyum_test
          PGVECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmaviyum_test
          REDIS_URL: redis://localhost:6379/15
          ENVIRONMENT: development
        run: uv run pytest tests/integration/ -v -m integration --cov=src/pharmaviyum --cov-report=xml --cov-report=term-missing

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen
      - name: pip-audit diagnostics
        run: uv run pip-audit --skip-editable
      - name: Bandit diagnostics
        run: |
          uv run bandit -r src/pharmaviyum/ -ll             --exclude src/pharmaviyum/ai/mortarium_rag/ingestion/deduplication.py,src/pharmaviyum/ai/mortarium_rag/ingestion/versioning.py,src/pharmaviyum/ai/mortarium_rag/vector_store.py
          uv run bandit -r             src/pharmaviyum/ai/mortarium_rag/ingestion/deduplication.py,            src/pharmaviyum/ai/mortarium_rag/ingestion/versioning.py,            src/pharmaviyum/ai/mortarium_rag/vector_store.py             -ll -s B608

  rag-evaluation:
    name: RAG Safety Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-unit, security]
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install uv
      - run: uv sync --frozen
      - name: Validate golden dataset
        run: uv run pytest tests/test_evaluation.py -v -m unit

  build:
    name: Build and Publish Immutable Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-unit, test-integration, security, rag-evaluation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-checks:
    name: Frontend Build, Lint and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        working-directory: frontend/shadcn-admin
        run: bun install
      - name: Install Chromium for Vitest browser tests
        working-directory: frontend/shadcn-admin
        run: bun run test:browser:install
      - name: ESLint for sidebar navigation changes
        working-directory: frontend/shadcn-admin
        run: bunx eslint src/components/layout/data/sidebar-data.ts src/components/layout/data/sidebar-data.test.ts
      - name: Frontend build and TypeScript
        working-directory: frontend/shadcn-admin
        run: bun run build
      - name: Vitest
        working-directory: frontend/shadcn-admin
        run: bun run test
