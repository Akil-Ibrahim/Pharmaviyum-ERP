name: CI/CD Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
  workflow_run:
    workflows: [Auto-fix lint baseline]
    types: [completed]
    branches: [dev]

env:
  PYTHON_VERSION: '3.13'
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: pharmaviyum_test
  IMAGE_NAME: pharmaviyum-crm
  IMAGE_REPOSITORY: ghcr.io/akil-ibrahim/pharmaviyum-crm

permissions:
  contents: read

concurrency:
  group: pharmaviyum-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, Format and Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'ruff==0.12.10' 'black==25.1.0' 'isort==6.0.1' 'mypy==1.17.1'
      - name: Ruff diagnostics
        shell: bash
        run: |
          set +e
          ruff check src/ tests/ 2>&1 | tee /tmp/ruff.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Ruff failed::$(tail -n 30 /tmp/ruff.log | tr '\n' ' ')"
          fi
          exit "$status"
      - name: Black diagnostics
        shell: bash
        run: |
          set +e
          black --check src/ tests/ 2>&1 | tee /tmp/black.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Black formatting failed::$(tail -n 30 /tmp/black.log | tr '\n' ' ')"
          fi
          exit "$status"
      - name: isort diagnostics
        shell: bash
        run: |
          set +e
          isort --check-only src/ tests/ 2>&1 | tee /tmp/isort.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=isort failed::$(tail -n 30 /tmp/isort.log | tr '\n' ' ')"
          fi
          exit "$status"
      - name: mypy diagnostics
        shell: bash
        run: |
          set +e
          mypy src/pharmaviyum/ 2>&1 | tee /tmp/mypy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=mypy failed::$(tail -n 30 /tmp/mypy.log | tr '\n' ' ')"
          fi
          exit "$status"

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmaviyum_test
          PGVECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmaviyum_test
          REDIS_URL: redis://localhost:6379/15
          ENVIRONMENT: testing
        run: pytest tests/unit/ -v -m unit --cov=src/pharmaviyum --cov-report=xml --cov-report=term-missing

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmaviyum_test
          PGVECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmaviyum_test
          REDIS_URL: redis://localhost:6379/15
          ENVIRONMENT: testing
        run: pytest tests/integration/ -v -m integration --cov=src/pharmaviyum --cov-report=xml --cov-report=term-missing

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pip-audit==2.9.0' 'bandit==1.8.6'
      - name: pip-audit diagnostics
        shell: bash
        run: |
          set +e
          pip-audit -r requirements.txt 2>&1 | tee /tmp/pip-audit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=pip-audit failed::$(tail -n 30 /tmp/pip-audit.log | tr '\n' ' ')"
          fi
          exit "$status"
      - name: Bandit diagnostics
        shell: bash
        run: |
          set +e
          bandit -r src/pharmaviyum/ -ll 2>&1 | tee /tmp/bandit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Bandit failed::$(tail -n 40 /tmp/bandit.log | tr '\n' ' ')"
          fi
          exit "$status"

  rag-evaluation:
    name: RAG Safety Regression
    runs-on: ubuntu-latest
    needs: [test-unit, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate golden dataset
        run: pytest tests/test_evaluation.py -v -m unit

  build:
    name: Build and Publish Immutable Image
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, security, rag-evaluation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-manifest:
    name: Generate Release Manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      - name: Write release manifest
        run: |
          mkdir -p release
          cat > release/manifest.json <<EOF
          {"commit":"${{ github.sha }}","image":"${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}","digest":"${{ needs.build.outputs.image_digest }}","environment":"staging"}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release/manifest.json

  # Deployment is intentionally implemented in .github/workflows/release.yml.
  # CI remains a non-mutating validation/build pipeline.
