name: Temporary navigation formatting

on:
  push:
    branches:
      - revert/todays-navigation-color-changes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend/shadcn-admin
      - name: Format changed navigation files
        run: bunx prettier --write src/components/layout/nav-group.tsx src/context/theme-provider.tsx src/features/settings/appearance/appearance-form.tsx
        working-directory: frontend/shadcn-admin
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/shadcn-admin/src/components/layout/nav-group.tsx frontend/shadcn-admin/src/context/theme-provider.tsx frontend/shadcn-admin/src/features/settings/appearance/appearance-form.tsx
          git commit -m "style(ui): apply Prettier to navigation preference changes"
          git push
