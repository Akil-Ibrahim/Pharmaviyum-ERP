name: Temporary POS Prettier Format
on:
  push:
    branches:
      - feat/pos-pharmacy-register-layout
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/shadcn-admin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/features/pos/index.tsx
      - name: Print formatted diff
        run: git -C ../.. diff -- frontend/shadcn-admin/src/features/pos/index.tsx
