name: Validate FastAPI 0.163.1 dependency refresh

on:
  push:
    branches:
      - chore/fastapi-0.163.1

permissions:
  contents: read

jobs:
  refresh-test-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmaviyum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmaviyum_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8.8.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmaviyum_test
      PGVECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmaviyum_test
      REDIS_URL: redis://localhost:6379/15
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/fastapi-0.163.1
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          python-version: "3.15.2"
          enable-cache: true
      - name: Regenerate uv.lock
        run: uv lock --upgrade-package fastapi
      - name: Upload regenerated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-0.163.1-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 3
      - name: Install exact locked environment
        run: uv sync --frozen
      - name: Run full test suite
        run: uv run pytest
      - name: Run dependency security audit
        run: uv run pip-audit --skip-editable
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-0.163.1-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 3
