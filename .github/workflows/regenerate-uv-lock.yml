name: Regenerate uv.lock (temporary)

on:
  push:
    branches: [chore/fastapi-native-otel]
    paths-ignore:
      - uv.lock

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: chore/fastapi-native-otel
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - name: Install uv
        run: python -m pip install uv
      - name: Regenerate lockfile
        run: uv lock
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: regenerate uv.lock"
          git push origin HEAD:chore/fastapi-native-otel
