name: Release

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: 40-character commit SHA of the immutable GHCR image to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  IMAGE_REPOSITORY: ghcr.io/akil-ibrahim/pharmaviyum-crm

concurrency:
  group: pharmaviyum-release-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_digest: ${{ steps.resolve.outputs.image_digest }}
    steps:
      - name: Validate image SHA
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release image digest
        id: resolve
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -Eeuo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$IMAGE_SHA" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid OCI image digest"
            exit 1
          fi
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved release image to $IMAGE_REPOSITORY@$digest"

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.image_sha }}
          fetch-depth: 1

      - name: Validate staging target configuration
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGVECTOR_DATABASE_URL: ${{ secrets.STAGING_PGVECTOR_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          OLLAMA_BASE_URL: ${{ secrets.STAGING_OLLAMA_BASE_URL }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS GHCR_USERNAME GHCR_TOKEN DATABASE_URL PGVECTOR_DATABASE_URL REDIS_URL OLLAMA_BASE_URL STAGING_URL; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required staging environment secret: $name"
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Authenticate staging host to GHCR
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/staging_key "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Upload release contract
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          ssh -i ~/.ssh/staging_key "$SSH_USER@$SSH_HOST" 'mkdir -p ~/pharmaviyum-release'
          scp -i ~/.ssh/staging_key deploy/docker-compose.release.yml scripts/release/deploy.sh \
            "$SSH_USER@$SSH_HOST:~/pharmaviyum-release/"

      - name: Deploy immutable image and migrate once
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          IMAGE_DIGEST: ${{ needs.validate.outputs.image_digest }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGVECTOR_DATABASE_URL: ${{ secrets.STAGING_PGVECTOR_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          OLLAMA_BASE_URL: ${{ secrets.STAGING_OLLAMA_BASE_URL }}
          OLLAMA_API_KEY: ${{ secrets.STAGING_OLLAMA_API_KEY }}
          OLLAMA_FAST_MODEL: ${{ vars.STAGING_OLLAMA_FAST_MODEL }}
          OLLAMA_MAIN_MODEL: ${{ vars.STAGING_OLLAMA_MAIN_MODEL }}
          OLLAMA_COMPLEX_MODEL: ${{ vars.STAGING_OLLAMA_COMPLEX_MODEL }}
          OLLAMA_EMBEDDING_MODEL: ${{ vars.STAGING_OLLAMA_EMBEDDING_MODEL }}
        run: |
          set -Eeuo pipefail
          release_env="$(mktemp)"
          trap 'rm -f "$release_env"' EXIT

          write_env() {
            printf '%s=%q\n' "$1" "$2" >> "$release_env"
          }

          : > "$release_env"
          write_env APP_IMAGE "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          write_env IMAGE_SHA "${{ inputs.image_sha }}"
          write_env DATABASE_URL "$DATABASE_URL"
          write_env PGVECTOR_DATABASE_URL "$PGVECTOR_DATABASE_URL"
          write_env REDIS_URL "$REDIS_URL"
          write_env OLLAMA_BASE_URL "$OLLAMA_BASE_URL"
          write_env OLLAMA_API_KEY "$OLLAMA_API_KEY"
          write_env OLLAMA_FAST_MODEL "${OLLAMA_FAST_MODEL:-qwen2.5:1.5b}"
          write_env OLLAMA_MAIN_MODEL "${OLLAMA_MAIN_MODEL:-qwen2.5:7b}"
          write_env OLLAMA_COMPLEX_MODEL "${OLLAMA_COMPLEX_MODEL:-qwen2.5:72b}"
          write_env OLLAMA_EMBEDDING_MODEL "${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large}"
          write_env ENVIRONMENT staging

          scp -i ~/.ssh/staging_key "$release_env" \
            "$SSH_USER@$SSH_HOST:~/pharmaviyum-release/.env"
          ssh -i ~/.ssh/staging_key "$SSH_USER@$SSH_HOST" \
            'chmod 600 ~/pharmaviyum-release/.env && chmod 700 ~/pharmaviyum-release/deploy.sh && cd ~/pharmaviyum-release && set -a && . ./.env && set +a && ./deploy.sh'

      - name: External staging smoke test
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error "$STAGING_URL/health" >/dev/null; then
              echo "Staging smoke test passed"
              exit 0
            fi
            sleep 3
          done
          echo "Staging smoke test failed"
          exit 1
