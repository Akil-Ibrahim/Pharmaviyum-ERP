name: Verify uv migration (temporary)

on:
  push:
    branches: [chore/fastapi-native-otel]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
      - Dockerfile

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked environment
        run: uv sync --frozen --group dev
      - name: Verify FastAPI and OTel packages
        run: uv run python -c "import fastapi; import opentelemetry; print(fastapi.__version__)"
      - name: Lint
        run: uv run ruff check src/ tests/
