name: Runner Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-test:
    name: Verify GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner test
        run: |
          echo "RUNNER_OK"
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          uname -a
          python --version
