name: Refresh pypdf lockfile

on:
  push:
    branches:
      - fix/gate-fastapi-cloud-deploy-2026-11-02

permissions:
  contents: write

concurrency:
  group: refresh-pypdf-lock
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
      - name: Regenerate lockfile
        run: uv lock --upgrade-package pypdf
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "security: refresh pypdf lockfile"
          git push
