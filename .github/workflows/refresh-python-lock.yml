name: Refresh Python lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-python-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Resolve and validate Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Resolve dependency lockfile
        run: uv lock --upgrade

      - name: Verify locked environment installs
        run: uv sync --frozen

      - name: Commit refreshed lockfile on this branch
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "security: refresh Python dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Audit resolved dependencies
        run: uv run pip-audit --skip-editable
