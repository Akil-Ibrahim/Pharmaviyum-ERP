name: Validate medicine reference catalog (dry-run only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medicine-reference-catalog-dry-run
  cancel-in-progress: false

jobs:
  validate:
    name: Validate official reference sources without database writes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.0"
          version: "0.13.8"
          enable-cache: true

      - name: Install locked project dependencies
        run: uv sync --frozen

      - name: Dry-run RxNorm (US reference data)
        run: uv run python scripts/import_rxnorm_catalog.py --dry-run

      - name: Dry-run EMA Article 57 (EEA reference data)
        run: uv run python scripts/import_ema_catalog.py --dry-run

      - name: Dry-run Health Canada DPD (Canada medicine reference data)
        run: uv run python scripts/import_health_canada_dpd.py --dry-run

      - name: Dry-run Health Canada MDALL (Canada medical-device reference data)
        run: uv run python scripts/import_health_canada_mdall.py --dry-run

      - name: Confirm dry-run only
        run: |
          echo "Dry-runs completed. This workflow has no database credentials and cannot write to QA or production."
