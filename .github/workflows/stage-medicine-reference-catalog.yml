name: Stage medicine reference catalog

on:
  workflow_dispatch:
    inputs:
      stage_records:
        description: "After all dry-runs pass, write eligible records as pending_review (no sellable products or stock)."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: medicine-reference-catalog-staging
  cancel-in-progress: false

jobs:
  stage:
    name: Validate and optionally stage reference records
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # This one-off import runner does not issue application JWTs.
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true

      - name: Validate database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing required GitHub Actions secret: DATABASE_URL"
            exit 1
          fi

      - name: Install locked project dependencies
        run: uv sync --frozen

      - name: Dry-run RxNorm (US reference data)
        run: uv run python scripts/import_rxnorm_catalog.py --dry-run

      - name: Dry-run EMA Article 57 (EEA reference data)
        run: uv run python scripts/import_ema_catalog.py --dry-run

      - name: Dry-run Health Canada DPD (Canada reference data)
        run: uv run python scripts/import_health_canada_dpd.py --dry-run

      - name: Stage eligible reference records for review
        if: inputs.stage_records
        run: |
          uv run python scripts/import_rxnorm_catalog.py
          uv run python scripts/import_ema_catalog.py
          uv run python scripts/import_health_canada_dpd.py

      - name: Report dry-run only
        if: ${{ !inputs.stage_records }}
        run: |
          echo "Dry-runs completed. Production database was not modified."
          echo "Re-run this workflow with stage_records=true to stage eligible records."
