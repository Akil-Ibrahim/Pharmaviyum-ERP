name: Diagnose FastAPI Cloud Demo

# Read-only diagnostics for the public Demo only. This workflow never deploys,
# migrates, or writes application data.
on:
  workflow_dispatch:
    inputs:
      expected_demo_commit:
        description: "Optional expected Demo build commit SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fastapi-cloud-demo-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only Demo smoke checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_URL: https://pharmaviyum-erp.fastapicloud.dev
      EXPECTED_DEMO_COMMIT: ${{ inputs.expected_demo_commit }}
    steps:
      - name: Check Demo endpoints without modifying data
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/pharmaviyum-diagnostics

          fetch_endpoint() {
            local name="$1"
            local path="$2"
            local accept="${3:-application/json}"
            local output="/tmp/pharmaviyum-diagnostics/${name}.body"
            local code
            code="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
              -H "Accept: ${accept}" \
              -H "Cache-Control: no-cache, no-store" \
              -H "Pragma: no-cache" \
              -o "$output" -w '%{http_code}' "${BASE_URL}${path}" || true)"
            code="${code:-000}"
            printf '%s=%s\n' "$name" "$code" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            if [[ "$code" == "000" ]]; then
              echo "Request failed or the Demo host could not be reached." >&2
            elif jq -e . "$output" >/dev/null 2>&1; then
              jq . "$output" >&2
            else
              head -c 1200 "$output" >&2 || true
              echo >&2
            fi
            printf '%s' "$code"
          }

          echo "## Pharmaviyum Demo diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: ${BASE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: read-only; no deployment or database writes" >> "$GITHUB_STEP_SUMMARY"

          version_code="$(fetch_endpoint version "/version")"
          if [[ "$version_code" != "200" ]]; then
            echo "::error::/version returned HTTP ${version_code}"
            exit 1
          fi
          version_file="/tmp/pharmaviyum-diagnostics/version.body"
          if ! jq -e '(.build_commit | type == "string") and (.python_implementation == "cpython")' "$version_file" >/dev/null; then
            echo "::error::/version response is missing expected runtime identity fields"
            exit 1
          fi
          actual_commit="$(jq -r '.build_commit' "$version_file")"
          python_version="$(jq -r '.python_version' "$version_file")"
          environment="$(jq -r '.environment' "$version_file")"
          debug="$(jq -r '.debug' "$version_file")"
          {
            echo "- Demo commit: $actual_commit"
            echo "- Python: $python_version"
            echo "- Environment: $environment"
            echo "- Debug: $debug"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$EXPECTED_DEMO_COMMIT" && "$actual_commit" != "$EXPECTED_DEMO_COMMIT" ]]; then
            echo "::error::Demo commit mismatch: expected ${EXPECTED_DEMO_COMMIT}, got ${actual_commit}"
            exit 1
          fi
          if [[ "$environment" != "staging" || "$debug" != "false" ]]; then
            echo "::error::Demo staging environment/debug assertion failed"
            exit 1
          fi

          health_code="$(fetch_endpoint health "/health")"
          if [[ "$health_code" != "200" ]] || ! jq -e '.status == "healthy" or .status == "degraded"' /tmp/pharmaviyum-diagnostics/health.body >/dev/null; then
            echo "::error::Demo liveness check failed"
            exit 1
          fi

          ready_code="$(fetch_endpoint ready "/ready")"
          if [[ "$ready_code" != "200" ]] || ! jq -e '
            .status == "ready" and
            .components.postgres == "ok" and
            .components.redis == "ok" and
            .components.ai_initialized == "ok"
          ' /tmp/pharmaviyum-diagnostics/ready.body >/dev/null; then
            echo "::error::Demo readiness check failed"
            exit 1
          fi

          appearance_code="$(fetch_endpoint appearance "/settings/appearance" "text/html")"
          if [[ "$appearance_code" != "200" ]] || ! grep -Eiq '<html([[:space:]>])' /tmp/pharmaviyum-diagnostics/appearance.body; then
            echo "::error::Frontend SPA route /settings/appearance failed"
            exit 1
          fi

          pos_code="$(fetch_endpoint pos_unauthorized "/api/v1/pos/products/search?q=omeprazole&pharmacy_id=1")"
          if [[ "$pos_code" != "401" ]]; then
            echo "::error::Protected POS endpoint expected HTTP 401 without a token; got ${pos_code}"
            exit 1
          fi

          echo "## Result" >> "$GITHUB_STEP_SUMMARY"
          echo "All read-only Demo smoke checks passed." >> "$GITHUB_STEP_SUMMARY"
