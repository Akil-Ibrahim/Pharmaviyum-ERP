name: DevRAG Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  answer-question:
    if: contains(github.event.comment.body, '@devrag')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: pip install -r dev_rag/requirements.txt

      - name: Run DevRAG Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use a fast cloud API for CI/CD (GitHub Actions can't access your local Ollama)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }} 
        run: python dev_rag/bot_handler.py "${{ github.event.comment.body }}" "${{ github.event.issue.number }}"

      - name: Comment on Issue/PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const answer = fs.readFileSync('dev_rag_answer.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: answer
            })
