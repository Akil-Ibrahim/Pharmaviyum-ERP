name: Temporary navigation formatting

on:
  push:
    branches:
      - feat/navigation-visual-system

permissions:
  contents: write

jobs:
  format-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Format appearance settings
        run: |
          cd frontend/shadcn-admin
          bun install --frozen-lockfile
          bunx prettier --write src/features/settings/appearance/appearance-form.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/shadcn-admin/src/features/settings/appearance/appearance-form.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style(settings): apply Prettier formatting"
          git push
