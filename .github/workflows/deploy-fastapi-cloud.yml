name: Deploy to FastAPI Cloud

# Production deployment is intentionally manual. CI completion must never deploy
# to FastAPI Cloud or run database migrations as a side effect.
on:
  workflow_dispatch:
    inputs:
      change_reference:
        description: "Approved production change or ticket reference"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fastapi-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build frontend and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true
        with:
          bun-version: "1.4.4"

      - name: Install Bun from npm if GitHub Releases is unavailable
        if: steps.setup-bun.outcome == 'failure'
        run: |
          npm install --global bun@1.4.4
          test "$(bun --version)" = "1.4.4"

      - name: Build React frontend
        working-directory: frontend/shadcn-admin
        run: |
          bun install
          bun run build
          test -s dist/index.html
          test -d dist/assets
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Stage frontend build at the FastAPI Cloud static path
        run: |
          set -euo pipefail
          rm -rf static
          mkdir -p static
          cp -a frontend/shadcn-admin/dist/. static/
          test -s static/index.html
          test -d static/assets
          echo "Staged $(find static -type f | wc -l) frontend files for the FastAPI Cloud upload."

      - name: Set up uv and managed Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          python-version: "3.15.2"
          enable-cache: true

      - name: Verify CI passed for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CI_CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&per_page=20" \
            --jq '[.workflow_runs[] | select((.event == "push" or .event == "workflow_dispatch") and .head_sha == env.DEPLOY_SHA)] | sort_by(.created_at) | last | .conclusion // empty')"
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "Refusing production deploy: CI for ${DEPLOY_SHA} is not successful (conclusion: ${CI_CONCLUSION:-not found})."
            exit 1
          fi

      # Alembic migrations are a separate, explicitly approved operation.
      # This deployment workflow must not mutate the production schema.

      - name: Validate production deployment inputs
        env:
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CHANGE_REFERENCE" ]]; then
            echo "Refusing production deployment: provide an approved change reference."
            exit 1
          fi
          for secret_name in FASTAPI_CLOUD_TOKEN FASTAPI_CLOUD_APP_ID DATABASE_URL; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Refusing production deployment: required secret/input is missing: $secret_name"
              exit 1
            fi
          done
          {
            echo "## Production deployment approval"
            echo "- Change reference: $CHANGE_REFERENCE"
            echo "- Commit: $DEPLOY_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy application and wait for verification
        run: uv run fastapi cloud deploy .
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

      - name: Verify production catalog exclusions (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          import os
          import psycopg
          from psycopg.rows import dict_row
          from src.pharmaviyum.services.catalog_exclusions import is_excluded_catalog_entry

          with psycopg.connect(os.environ["DATABASE_URL"], row_factory=dict_row) as conn:
              source_rows = conn.execute(
                  "SELECT id, normalized_payload FROM drug_catalog_source_records"
              ).fetchall()
              excluded_sources = []
              for row in source_rows:
                  payload = row["normalized_payload"] or {}
                  if isinstance(payload, str):
                      import json
                      payload = json.loads(payload)
                  if is_excluded_catalog_entry(
                      brand_name=payload.get("brand_name") or payload.get("product_name"),
                      manufacturer=payload.get("manufacturer") or payload.get("holder"),
                      authorization_country=payload.get("authorization_country") or payload.get("country"),
                      manufacturer_country=payload.get("manufacturer_country")
                          or payload.get("country_of_origin")
                          or payload.get("country_of_manufacture"),
                      payload=payload,
                  ):
                      excluded_sources.append(row["id"])

              medicinal_rows = conn.execute(
                  """
                  SELECT id, brand_name, manufacturer,
                         authorization_country, manufacturer_country
                  FROM medicinal_products
                  """
              ).fetchall()
              excluded_medicinal_ids = {
                  row["id"] for row in medicinal_rows
                  if is_excluded_catalog_entry(
                      brand_name=row["brand_name"],
                      manufacturer=row["manufacturer"],
                      authorization_country=row["authorization_country"],
                      manufacturer_country=row["manufacturer_country"],
                  )
              }

              product_rows = conn.execute(
                  """
                  SELECT id, name, manufacturer, manufacturer_country,
                         medicinal_product_id, is_active
                  FROM products
                  """
              ).fetchall()
              excluded_active_products = [
                  row["id"] for row in product_rows
                  if row["is_active"] and (
                      is_excluded_catalog_entry(
                          brand_name=row["name"],
                          manufacturer=row["manufacturer"],
                          manufacturer_country=row["manufacturer_country"],
                      )
                      or row["medicinal_product_id"] in excluded_medicinal_ids
                  )
              ]
              retained_inactive_products = [
                  row["id"] for row in product_rows
                  if not row["is_active"] and (
                      is_excluded_catalog_entry(
                          brand_name=row["name"],
                          manufacturer=row["manufacturer"],
                          manufacturer_country=row["manufacturer_country"],
                      )
                      or row["medicinal_product_id"] in excluded_medicinal_ids
                  )
              ]

          if excluded_sources or excluded_active_products:
              raise SystemExit(
                  "Catalog exclusion verification failed: "
                  f"{len(excluded_sources)} excluded source records and "
                  f"{len(excluded_active_products)} active excluded products remain."
              )

          print(
              "Catalog exclusion verification passed: "
              f"{len(source_rows)} source records checked; "
              f"{len(product_rows)} products checked; "
              f"{len(retained_inactive_products)} inactive historical products retained."
          )
          PY

      - name: Verify production health, authentication and POS protection
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          base_url="https://pharmaviyum-erp-crm.fastapicloud.dev"

          # Create a per-run pharmacist account through the existing registration
          # endpoint. Credentials exist only in this runner's process environment.
          SMOKE_USERNAME="pharmaviyum-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SMOKE_EMAIL="${SMOKE_USERNAME}@pharmaviyum.invalid"
          SMOKE_PASSWORD="$(openssl rand -hex 32)"
          SMOKE_USER_CREATED=false

          cleanup_smoke_user() {
            local exit_code=$?
            if [ "$SMOKE_USER_CREATED" = "true" ]; then
              if ! uv run python - <<'PY'
          import os
          import psycopg

          database_url = os.environ["DATABASE_URL"]
          # FastAPI's SQLAlchemy setting commonly uses the asyncpg dialect;
          # psycopg requires a synchronous PostgreSQL URL.
          if database_url.startswith("postgresql+asyncpg://"):
              database_url = database_url.replace(
                  "postgresql+asyncpg://", "postgresql://", 1
              )
          elif database_url.startswith("postgres+asyncpg://"):
              database_url = database_url.replace(
                  "postgres+asyncpg://", "postgresql://", 1
              )

          with psycopg.connect(database_url) as conn:
              result = conn.execute(
                  """
                  DELETE FROM users
                  WHERE username = %s AND email = %s AND is_superuser = FALSE
                  """,
                  (os.environ["SMOKE_USERNAME"], os.environ["SMOKE_EMAIL"]),
              )
              if result.rowcount != 1:
                  raise RuntimeError(
                      "Expected to remove exactly the temporary smoke user; "
                      f"removed {result.rowcount} rows."
                  )
          PY
              then
                echo "ERROR: failed to remove the temporary smoke user." >&2
                exit_code=1
              fi
            fi
            exit "$exit_code"
          }
          export SMOKE_USERNAME SMOKE_EMAIL DATABASE_URL
          trap cleanup_smoke_user EXIT

          health="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$base_url/health")"
          printf '%s\n' "$health" | jq -e '.status == "healthy"' >/dev/null

          readiness="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$base_url/ready")"
          printf '%s\n' "$readiness" | jq -e '
            .status == "ready" and
            .components.postgres == "ok" and
            .components.redis == "ok" and
            .components.ai_initialized == "ok"
          ' >/dev/null

          appearance_status="$(curl --silent --show-error -o /tmp/appearance.html -w '%{http_code}' \
            "$base_url/settings/appearance")"
          if [ "$appearance_status" != "200" ] || ! grep -Eiq '<html([[:space:]>])' /tmp/appearance.html; then
            echo "Frontend SPA route /settings/appearance did not return the built HTML entrypoint (HTTP $appearance_status)."
            head -c 1000 /tmp/appearance.html || true
            exit 1
          fi

          auth_status="$(curl --silent --show-error -o /tmp/auth-invalid.json -w '%{http_code}' \
            -X POST "$base_url/api/v1/auth/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=pharmaviyum-smoke-invalid-user' \
            --data-urlencode 'password=not-a-real-password')"
          if [ "$auth_status" != "401" ]; then
            echo "Authentication negative-path smoke test expected HTTP 401, received $auth_status."
            cat /tmp/auth-invalid.json
            exit 1
          fi

          pos_status="$(curl --silent --show-error -o /tmp/pos-unauthorized.json -w '%{http_code}' \
            "$base_url/api/v1/pos/products/search?q=omeprazole&pharmacy_id=1")"
          if [ "$pos_status" != "401" ]; then
            echo "Protected POS search expected HTTP 401 without a token, received $pos_status."
            cat /tmp/pos-unauthorized.json
            exit 1
          fi

          registration_response="$(curl --fail --silent --show-error \
            -X POST "$base_url/api/v1/auth/register" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg email "$SMOKE_EMAIL" --arg password "$SMOKE_PASSWORD" \
              '{email: $email, password: $password}')")"
          SMOKE_USER_CREATED=true
          printf '%s\n' "$registration_response" | jq -e --arg username "$SMOKE_USERNAME" \
            '.username == $username and .email == ($username + "@pharmaviyum.invalid")' >/dev/null

          login_response="$(curl --fail --silent --show-error \
            -X POST "$base_url/api/v1/auth/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "username=$SMOKE_USERNAME" \
            --data-urlencode "password=$SMOKE_PASSWORD")"
          access_token="$(printf '%s' "$login_response" | jq -er '.access_token')"
          profile="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $access_token" "$base_url/api/v1/auth/me")"
          printf '%s\n' "$profile" | jq -e '.accountNo and .email' >/dev/null

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $access_token" \
            "$base_url/api/v1/drug-catalog/search?q=omeprazole" \
            -o /tmp/drug-catalog-smoke.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $access_token" \
            "$base_url/api/v1/products/search?q=omeprazole" \
            -o /tmp/products-smoke.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from src.pharmaviyum.services.catalog_exclusions import is_excluded_catalog_entry

          for path in ("/tmp/drug-catalog-smoke.json", "/tmp/products-smoke.json"):
              rows = json.loads(Path(path).read_text())
              if not isinstance(rows, list):
                  raise SystemExit(f"Expected a list response from {path}")
              if not rows:
                  raise SystemExit(
                      f"No omeprazole results returned by {path}; "
                      "refusing to mark the production catalog smoke test as successful."
                  )
              for row in rows:
                  if is_excluded_catalog_entry(
                      brand_name=row.get("brand_name") or row.get("name"),
                      manufacturer=row.get("manufacturer"),
                      authorization_country=row.get("authorization_country"),
                      manufacturer_country=row.get("manufacturer_country"),
                      payload=row,
                  ):
                      raise SystemExit(f"Excluded medicine surfaced by {path}")
          print("Authenticated catalog search returned no excluded medicines.")
          PY

          echo "Authenticated sign-in, /auth/me and catalog exclusion smoke checks passed."

          echo "Production liveness, readiness, invalid-credential handling and protected POS access checks passed."
          echo "POS checkout exclusion and stock immutability are covered by the PostgreSQL integration suite; no production sale or stock mutation was created by this smoke run."
