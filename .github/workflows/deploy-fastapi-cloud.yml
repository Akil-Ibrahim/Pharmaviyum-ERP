name: Deploy to FastAPI Cloud

# Production deployment is intentionally manual. CI completion must never deploy
# to FastAPI Cloud or run database migrations as a side effect.
on:
  workflow_dispatch:
    inputs:
      change_reference:
        description: "Approved production change or ticket reference"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fastapi-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build frontend and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true
        with:
          bun-version: "1.4.4"

      - name: Install Bun from npm if GitHub Releases is unavailable
        if: steps.setup-bun.outcome == 'failure'
        run: |
          npm install --global bun@1.4.4
          test "$(bun --version)" = "1.4.4"

      - name: Build React frontend
        working-directory: frontend/shadcn-admin
        run: |
          bun install --frozen-lockfile
          bun run build
          test -s dist/index.html
          test -d dist/assets
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Stage frontend build at the FastAPI Cloud static path
        run: |
          set -euo pipefail
          rm -rf static
          mkdir -p static
          cp -a frontend/shadcn-admin/dist/. static/
          test -s static/index.html
          test -d static/assets
          echo "Staged $(find static -type f | wc -l) frontend files for the FastAPI Cloud upload."

      - name: Set up uv and managed Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          python-version: "3.15.2"
          enable-cache: true

      - name: Wait for CI to pass for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${DEPLOY_SHA}&per_page=100")"
            CI_RUN="$(printf '%s' "$RUNS" | jq -c '
              [.workflow_runs[]
                | select(.path == ".github/workflows/ci.yml"
                  and (.event == "push" or .event == "workflow_dispatch")
                  and .head_sha == env.DEPLOY_SHA)]
              | sort_by(.created_at) | last // empty')"
            if [ -n "$CI_RUN" ]; then
              STATUS="$(printf '%s' "$CI_RUN" | jq -r '.status')"
              CONCLUSION="$(printf '%s' "$CI_RUN" | jq -r '.conclusion // empty')"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "CI passed for ${DEPLOY_SHA}."
                  exit 0
                fi
                echo "Refusing production deploy: CI concluded ${CONCLUSION:-without a conclusion}."
                exit 1
              fi
              echo "CI is still ${STATUS}; waiting (attempt ${attempt}/60)."
            else
              echo "CI run for ${DEPLOY_SHA} has not appeared yet (attempt ${attempt}/60)."
            fi
            sleep 10
          done
          echo "Refusing production deploy: timed out waiting for CI on ${DEPLOY_SHA}."
          exit 1

      # Alembic migrations are a separate, explicitly approved operation.
      # This deployment workflow must not mutate the production schema.

      - name: Validate production deployment inputs
        env:
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CHANGE_REFERENCE" ]]; then
            echo "Refusing production deployment: provide an approved change reference."
            exit 1
          fi
          for secret_name in FASTAPI_CLOUD_TOKEN FASTAPI_CLOUD_APP_ID DATABASE_URL; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Refusing production deployment: required secret/input is missing: $secret_name"
              exit 1
            fi
          done
          {
            echo "## Production deployment approval"
            echo "- Change reference: $CHANGE_REFERENCE"
            echo "- Commit: $DEPLOY_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production database schema is compatible (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          import os
          import sys

          import psycopg
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          expected_heads = set(ScriptDirectory.from_config(Config("alembic.ini")).get_heads())
          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              actual_heads = {
                  row[0]
                  for row in connection.execute(
                      "SELECT version_num FROM alembic_version"
                  ).fetchall()
              }
              inventory_ledger = connection.execute(
                  "SELECT to_regclass('public.inventory_movements') IS NOT NULL"
              ).fetchone()[0]

          if actual_heads != expected_heads:
              print(
                  "Refusing application deployment: production Alembic revisions "
                  f"{sorted(actual_heads)} do not match code heads {sorted(expected_heads)}."
              )
              print("Apply and verify the separately approved migrations before deploying.")
              sys.exit(1)
          if not inventory_ledger:
              print("Refusing application deployment: inventory_movements table is missing.")
              sys.exit(1)
          print(f"Production schema is at expected Alembic heads: {sorted(actual_heads)}")
          PY

      # FASTAPI_CLOUD_TOKEN is a deploy token. It authorizes deployments,
      # not account-authenticated app-management commands such as "cloud env set".
      # Configure ENVIRONMENT=production once in the FastAPI Cloud dashboard;
      # the runtime smoke test below refuses to pass unless production mode is active.
      - name: Submit deployment and let production smoke tests verify rollout
        # The deploy token can create deployments but cannot authenticate the
        # account-scoped deployment-status read API. --no-wait avoids treating
        # that unsupported status lookup as a deployment failure; the following
        # production smoke tests remain the authoritative rollout gate.
        run: uv run fastapi cloud deploy . --no-wait
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

      # The deploy CLI is intentionally asynchronous. Do not let the smoke
      # suite accidentally validate the previous production instance.
      - name: Wait for the new production runtime to become active
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://pharmaviyum-erp-crm.fastapicloud.dev"
          for attempt in $(seq 1 60); do
            # Bypass intermediary caches so this gate observes the runtime that is
            # currently serving requests, not a stale cached /version response.
            runtime_info="$(curl --silent --show-error --fail \
              -H "Cache-Control: no-cache, no-store" \
              -H "Pragma: no-cache" \
              "$base_url/version?deploy_sha=${DEPLOY_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$runtime_info" | jq -e '
              .environment == "production" and
              .application_environment == "production" and
              .auth_environment == "production" and
              .debug == false and
              .auth_debug == false and
              (.python_version | startswith("3.15.")) and
              .python_implementation == "cpython"
            ' >/dev/null 2>&1; then
              echo "New production runtime is active."
              exit 0
            fi
            echo "Waiting for the new production runtime (attempt ${attempt}/60)."
            sleep 5
          done
          echo "Production runtime did not switch to production on CPython 3.15.x within five minutes."
          printf '%s\\n' "${runtime_info:-No /version response}" | jq '{environment, application_environment, auth_environment, debug, auth_debug, python_version}' 2>/dev/null || true
          exit 1

      # Reference catalog contents are validated by dedicated data-import tests.
      # Deployment smoke tests must verify the API contract, not require a seeded drug dataset.

      - name: Verify production health, authentication and POS protection (temporary test account)
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          base_url="https://pharmaviyum-erp-crm.fastapicloud.dev"

          # This smoke test intentionally writes one temporary non-superuser account
          # to production through the public registration endpoint. It is not read-only.
          # Cleanup runs on normal exits and catchable INT/TERM signals; forced runner
          # termination (for example SIGKILL or host loss) can still prevent cleanup.
          SMOKE_USERNAME="pharmaviyum-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SMOKE_EMAIL="${SMOKE_USERNAME}@pharmaviyum.invalid"
          SMOKE_PASSWORD="$(openssl rand -hex 32)"
          SMOKE_USER_ATTEMPTED=false

          cleanup_smoke_user() {
            local exit_code=$?
            trap - EXIT INT TERM
            if [ "$SMOKE_USER_ATTEMPTED" = "true" ]; then
              if ! uv run python - <<'PY'
          import os
          import psycopg

          database_url = os.environ["DATABASE_URL"]
          # FastAPI's SQLAlchemy setting commonly uses the asyncpg dialect;
          # psycopg requires a synchronous PostgreSQL URL.
          if database_url.startswith("postgresql+asyncpg://"):
              database_url = database_url.replace(
                  "postgresql+asyncpg://", "postgresql://", 1
              )
          elif database_url.startswith("postgres+asyncpg://"):
              database_url = database_url.replace(
                  "postgres+asyncpg://", "postgresql://", 1
              )

          with psycopg.connect(database_url) as conn:
              result = conn.execute(
                  """
                  DELETE FROM users
                  WHERE username = %s AND email = %s AND is_superuser = FALSE
                  """,
                  (os.environ["SMOKE_USERNAME"], os.environ["SMOKE_EMAIL"]),
              )
              if result.rowcount not in (0, 1):
                  raise RuntimeError(
                      "Expected to remove zero or one temporary smoke user; "
                      f"removed {result.rowcount} rows."
                  )
          PY
              then
                echo "ERROR: failed to remove the temporary smoke user." >&2
                exit_code=1
              fi
            fi
            exit "$exit_code"
          }
          export SMOKE_USERNAME SMOKE_EMAIL DATABASE_URL
          trap cleanup_smoke_user EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          health_status="$(curl --silent --show-error --retry 60 --retry-delay 5 --retry-all-errors \
            -o /tmp/health.json -w '%{http_code}' "$base_url/health")"
          if [ "$health_status" != "200" ] || ! jq -e '.status == "healthy" or .status == "degraded"' /tmp/health.json >/dev/null; then
            echo "Production liveness check failed: HTTP $health_status."
            cat /tmp/health.json
            exit 1
          fi
          echo "Production liveness check passed."

          runtime_status="$(curl --silent --show-error --retry 60 --retry-delay 5 --retry-all-errors \
            -o /tmp/version.json -w '%{http_code}' "$base_url/version")"
          if [ "$runtime_status" != "200" ] || ! jq -e '
            .environment == "production" and
            .application_environment == "production" and
            .auth_environment == "production" and
            .debug == false and
            .auth_debug == false and
            (.python_version | startswith("3.15.")) and
            .python_implementation == "cpython"
          ' /tmp/version.json >/dev/null; then
            echo "Production runtime assertion failed: HTTP $runtime_status; expected production mode, debug=false, and CPython 3.15.x."
            cat /tmp/version.json
            exit 1
          fi
          echo "Production runtime identity check passed."

          # /ready intentionally reports only critical dependencies. Its current
          # public contract is checks.database.status / checks.redis.status;
          # AI initialization is not exposed by this endpoint and is not asserted.
          readiness_status="$(curl --silent --show-error --retry 60 --retry-delay 5 --retry-all-errors \
            -o /tmp/ready.json -w '%{http_code}' "$base_url/ready")"
          if [ "$readiness_status" != "200" ] || ! jq -e '
            .status == "ready" and
            .checks.database.status == "healthy" and
            .checks.redis.status == "healthy"
          ' /tmp/ready.json >/dev/null; then
            echo "Production readiness check failed: HTTP $readiness_status."
            cat /tmp/ready.json
            exit 1
          fi
          echo "Production readiness check passed."

          appearance_status="$(curl --silent --show-error -o /tmp/appearance.html -w '%{http_code}' \
            "$base_url/settings/appearance")"
          if [ "$appearance_status" != "200" ] || ! grep -Eiq '<html([[:space:]>])' /tmp/appearance.html; then
            echo "Frontend SPA route /settings/appearance did not return the built HTML entrypoint (HTTP $appearance_status)."
            head -c 1000 /tmp/appearance.html || true
            exit 1
          fi

          system_status_code="$(curl --silent --show-error -H 'Accept: text/html' \
            -o /tmp/system-status.html -w '%{http_code}' "$base_url/system-status")"
          if [ "$system_status_code" != "200" ] || ! grep -Eiq '<html([[:space:]>])' /tmp/system-status.html; then
            echo "Frontend SPA route /system-status did not return the built HTML entrypoint (HTTP $system_status_code)."
            head -c 1000 /tmp/system-status.html || true
            exit 1
          fi

          auth_status="$(curl --silent --show-error -o /tmp/auth-invalid.json -w '%{http_code}' \
            -X POST "$base_url/api/v1/auth/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=pharmaviyum-smoke-invalid-user' \
            --data-urlencode 'password=not-a-real-password')"
          if [ "$auth_status" != "401" ]; then
            echo "Authentication negative-path smoke test expected HTTP 401, received $auth_status."
            cat /tmp/auth-invalid.json
            exit 1
          fi

          pos_status="$(curl --silent --show-error -o /tmp/pos-unauthorized.json -w '%{http_code}' \
            "$base_url/api/v1/pos/products/search?q=omeprazole&pharmacy_id=1")"
          if [ "$pos_status" != "401" ]; then
            echo "Protected POS search expected HTTP 401 without a token, received $pos_status."
            cat /tmp/pos-unauthorized.json
            exit 1
          fi

          # Keep HTTP status and response bodies so a failed production
          # contract check identifies the exact endpoint and server response.
          # Mark the attempt before sending the request: the server may commit
          # the user even if the client loses the HTTP response.
          SMOKE_USER_ATTEMPTED=true
          registration_status="$(curl --silent --show-error -o /tmp/register.json -w '%{http_code}' \
            -X POST "$base_url/api/v1/auth/register" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg email "$SMOKE_EMAIL" --arg password "$SMOKE_PASSWORD" \
              '{email: $email, password: $password}')")"
          if [ "$registration_status" != "200" ] && [ "$registration_status" != "201" ]; then
            echo "Registration smoke test failed: HTTP $registration_status."
            cat /tmp/register.json
            exit 1
          fi
          jq -e --arg username "$SMOKE_USERNAME" --arg email "$SMOKE_EMAIL" \
            '.username == $username and .email == $email' /tmp/register.json >/dev/null || {
              echo "Registration response did not match the documented username/email contract."
              cat /tmp/register.json
              exit 1
            }
          echo "Registration smoke test passed (HTTP $registration_status)."

          login_status="$(curl --silent --show-error -o /tmp/login.json -w '%{http_code}' \
            -X POST "$base_url/api/v1/auth/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "username=$SMOKE_USERNAME" \
            --data-urlencode "password=$SMOKE_PASSWORD")"
          if [ "$login_status" != "200" ]; then
            echo "Login smoke test failed: HTTP $login_status."
            cat /tmp/login.json
            exit 1
          fi
          access_token="$(jq -er '.access_token' /tmp/login.json)" || {
            echo "Login endpoint returned HTTP 200 without an access_token."
            exit 1
          }
          echo "Login smoke test passed (HTTP $login_status)."

          profile_status="$(curl --silent --show-error -o /tmp/profile.json -w '%{http_code}' \
            -H "Authorization: Bearer $access_token" "$base_url/api/v1/auth/me")"
          if [ "$profile_status" != "200" ]; then
            echo "Authenticated profile smoke test failed: HTTP $profile_status."
            cat /tmp/profile.json
            exit 1
          fi
          jq -e '.accountNo and .email' /tmp/profile.json >/dev/null || {
            echo "Authenticated profile response did not contain accountNo and email."
            cat /tmp/profile.json
            exit 1
          }
          echo "Authenticated profile smoke test passed."

          for endpoint in "drug-catalog/search?q=omeprazole" "products/search?q=omeprazole"; do
            case "$endpoint" in
              drug-catalog/*) filename="drug-catalog" ;;
              products/*) filename="products" ;;
              *) echo "Unexpected smoke-test endpoint: $endpoint"; exit 1 ;;
            esac
            status="$(curl --silent --show-error -o "/tmp/$filename-smoke.json" -w '%{http_code}' \
              -H "Authorization: Bearer $access_token" "$base_url/$endpoint")"
            if [ "$status" != "200" ]; then
              echo "Catalog smoke test failed for /$endpoint: HTTP $status."
              cat "/tmp/$filename-smoke.json"
              exit 1
            fi
            echo "Catalog endpoint /$endpoint returned HTTP 200."
          done
          uv run python - <<'PY'
          import json
          from pathlib import Path

          for path in ("/tmp/drug-catalog-smoke.json", "/tmp/products-smoke.json"):
              payload = json.loads(Path(path).read_text())
              if not isinstance(payload, list):
                  raise SystemExit(f"Expected a list response from {path}")
              print(f"{path}: API contract valid; {len(payload)} result(s).")
          PY

          echo "Authenticated sign-in, /auth/me and catalog search API contract checks passed."

          echo "Production liveness, readiness, invalid-credential handling and protected POS access checks passed."
          echo "POS checkout exclusion and stock immutability are covered by the PostgreSQL integration suite; no production sale or stock mutation was created by this smoke run."
