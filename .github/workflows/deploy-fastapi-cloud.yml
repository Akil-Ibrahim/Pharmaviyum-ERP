name: Deploy to FastAPI Cloud

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: fastapi-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build frontend and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build React frontend
        working-directory: frontend/shadcn-admin
        run: |
          bun install
          bun run build
          test -s dist/index.html
          test -d dist/assets
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Verify CI passed for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CI_CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&per_page=20" \
            --jq '[.workflow_runs[] | select((.event == "push" or .event == "workflow_dispatch") and .head_sha == env.DEPLOY_SHA)] | sort_by(.created_at) | last | .conclusion // empty')"
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "Refusing production deploy: CI for ${DEPLOY_SHA} is not successful (conclusion: ${CI_CONCLUSION:-not found})."
            exit 1
          fi

      - name: Apply database migrations before deployment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGVECTOR_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing required GitHub Actions secret: DATABASE_URL"
            exit 1
          fi
          uv sync --frozen
          uv run python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT current_user, session_user,
                             current_database(),
                             pg_get_userbyid(n.nspowner) AS schema_owner,
                             has_schema_privilege(current_user, 'public', 'USAGE') AS can_use,
                             has_schema_privilege(current_user, 'public', 'CREATE') AS can_create,
                             current_setting('role', true) AS active_role
                      FROM pg_namespace n
                      WHERE n.nspname = 'public'
                  """)
                  row = cur.fetchone()
                  print("Neon migration connection diagnostics:")
                  print({
                      "current_user": row[0],
                      "session_user": row[1],
                      "database": row[2],
                      "public_schema_owner": row[3],
                      "can_use_public": row[4],
                      "can_create_public": row[5],
                      "active_role": row[6],
                  })
          PY
          uv run alembic upgrade head

      - name: Deploy application and wait for verification
        run: uv run fastapi cloud deploy .
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

      - name: Verify production health, authentication and POS protection
        shell: bash
        env:
          SMOKE_USERNAME: ${{ secrets.PHARMAVIYUM_SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.PHARMAVIYUM_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          base_url="https://pharmaviyum-erp-crm.fastapicloud.dev"

          health="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$base_url/health")"
          printf '%s\n' "$health" | jq -e '.status == "healthy"' >/dev/null

          readiness="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$base_url/ready")"
          printf '%s\n' "$readiness" | jq -e '
            .status == "ready" and
            .components.postgres == "ok" and
            .components.redis == "ok" and
            .components.ai_initialized == "ok"
          ' >/dev/null

          auth_status="$(curl --silent --show-error -o /tmp/auth-invalid.json -w '%{http_code}' \
            -X POST "$base_url/api/v1/auth/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=pharmaviyum-smoke-invalid-user' \
            --data-urlencode 'password=not-a-real-password')"
          if [ "$auth_status" != "401" ]; then
            echo "Authentication negative-path smoke test expected HTTP 401, received $auth_status."
            cat /tmp/auth-invalid.json
            exit 1
          fi

          pos_status="$(curl --silent --show-error -o /tmp/pos-unauthorized.json -w '%{http_code}' \
            "$base_url/api/v1/pos/products/search?q=omeprazole&pharmacy_id=1")"
          if [ "$pos_status" != "401" ]; then
            echo "Protected POS search expected HTTP 401 without a token, received $pos_status."
            cat /tmp/pos-unauthorized.json
            exit 1
          fi

          if [ -n "$SMOKE_USERNAME" ] && [ -n "$SMOKE_PASSWORD" ]; then
            login_response="$(curl --fail --silent --show-error \
              -X POST "$base_url/api/v1/auth/token" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "username=$SMOKE_USERNAME" \
              --data-urlencode "password=$SMOKE_PASSWORD")"
            access_token="$(printf '%s' "$login_response" | jq -er '.access_token')"
            profile="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $access_token" "$base_url/api/v1/auth/me")"
            printf '%s\n' "$profile" | jq -e '.accountNo and .email' >/dev/null
            echo "Authenticated sign-in and /auth/me smoke checks passed."
          else
            echo "Successful sign-in smoke check skipped; configure PHARMAVIYUM_SMOKE_USERNAME and PHARMAVIYUM_SMOKE_PASSWORD Actions secrets to enable it."
          fi

          echo "Production liveness, readiness, invalid-credential handling and protected POS access checks passed."
