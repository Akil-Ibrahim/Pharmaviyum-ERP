name: Deploy to FastAPI Cloud

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: fastapi-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build frontend and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build React frontend
        working-directory: frontend/shadcn-admin
        run: |
          bun install
          bun run build
          test -s dist/index.html
          test -d dist/assets
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Verify CI passed for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CI_CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&per_page=20" \
            --jq '[.workflow_runs[] | select((.event == "push" or .event == "workflow_dispatch") and .head_sha == env.DEPLOY_SHA)] | sort_by(.created_at) | last | .conclusion // empty')"
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "Refusing production deploy: CI for ${DEPLOY_SHA} is not successful (conclusion: ${CI_CONCLUSION:-not found})."
            exit 1
          fi

      - name: Apply database migrations before deployment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGVECTOR_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing required GitHub Actions secret: DATABASE_URL"
            exit 1
          fi
          uv sync --frozen
          uv run python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT current_user, session_user,
                             current_database(),
                             pg_get_userbyid(n.nspowner) AS schema_owner,
                             has_schema_privilege(current_user, 'public', 'USAGE') AS can_use,
                             has_schema_privilege(current_user, 'public', 'CREATE') AS can_create,
                             current_setting('role', true) AS active_role
                      FROM pg_namespace n
                      WHERE n.nspname = 'public'
                  """)
                  row = cur.fetchone()
                  print("Neon migration connection diagnostics:")
                  print({
                      "current_user": row[0],
                      "session_user": row[1],
                      "database": row[2],
                      "public_schema_owner": row[3],
                      "can_use_public": row[4],
                      "can_create_public": row[5],
                      "active_role": row[6],
                  })
          PY
          uv run alembic upgrade head

      - name: Deploy application and wait for verification
        run: uv run fastapi cloud deploy .
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
