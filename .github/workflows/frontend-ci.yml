name: Frontend CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: pharmaviyum-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend/shadcn-admin

jobs:
  validate:
    name: Frontend Lint, Format and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --no-save

      - name: ESLint
        run: bun run lint

      - name: Prettier
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_REF="origin/$GITHUB_BASE_REF"
            FILES="$(git diff --name-only "$BASE_REF...$GITHUB_SHA" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.css' '*.html')"
          else
            FILES="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.css' '*.html')"
          fi
          if [ -n "$FILES" ]; then
            printf '%s\n' "$FILES" | xargs bunx prettier --check
          else
            echo "No frontend files changed; skipping Prettier."
          fi

      - name: TypeScript and production build
        run: bun run build
