name: Frontend CI

on:
  push:
    branches: [main, deploy/fastapi-cloud-prep]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pharmaviyum-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend/shadcn-admin

jobs:
  validate:
    name: Frontend Lint, Format and Build
    runs-on: ubuntu-24.04
    # Keep the browser runtime and OS dependencies aligned with the exact
    # Playwright version pinned in frontend/shadcn-admin/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.4.4"
      - name: Install Bun from npm if GitHub Releases is unavailable
        if: steps.setup-bun.outcome == 'failure'
        run: |
          npm install --global bun@1.4.4
          test "$(bun --version)" = "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ESLint
        run: bun run lint
      - name: Prettier
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="origin/$GITHUB_BASE_REF"
            HEAD_SHA="$GITHUB_SHA"
          else
            BASE_SHA="${GITHUB_SHA}^"
            HEAD_SHA="$GITHUB_SHA"
          fi

          mapfile -t CHANGED_PATHS < <(
            git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_SHA" "$HEAD_SHA" -- frontend/shadcn-admin
          )
          FILES=()
          for path in "${CHANGED_PATHS[@]}"; do
            case "$path" in
              *.ts|*.tsx|*.js|*.jsx|*.json|*.css|*.html)
                FILES+=("${path#frontend/shadcn-admin/}")
                ;;
            esac
          done
          FILES+=("src/features/auth/sign-in/components/user-auth-form.test.tsx")

          if (("${#FILES[@]}" > 0)); then
            bunx prettier --check "${FILES[@]}"
          else
            echo "No frontend files changed; skipping Prettier."
          fi
      - name: TypeScript and production build
        run: bun run build
      - name: Verify pinned Playwright browser runtime
        run: |
          bunx playwright --version
          bunx playwright install --list
      - name: Playwright end-to-end tests
        run: bun run test:e2e
      - name: Upload Playwright reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/shadcn-admin/test-results/
            frontend/shadcn-admin/playwright-report/
          if-no-files-found: warn
          retention-days: 14
