name: Frontend CI

on:
  push:
    branches: [main, deploy/fastapi-cloud-prep]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pharmaviyum-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend/shadcn-admin

jobs:
  validate:
    name: Frontend Lint, Format and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install
      - name: ESLint
        run: bun run lint
      - name: Prettier
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="origin/$GITHUB_BASE_REF"
            HEAD_SHA="$GITHUB_SHA"
          else
            BASE_SHA="${GITHUB_SHA}^"
            HEAD_SHA="$GITHUB_SHA"
          fi

          mapfile -t CHANGED_PATHS < <(
            git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_SHA" "$HEAD_SHA" -- frontend/shadcn-admin
          )
          FILES=()
          for path in "${CHANGED_PATHS[@]}"; do
            case "$path" in
              *.ts|*.tsx|*.js|*.jsx|*.json|*.css|*.html)
                FILES+=("${path#frontend/shadcn-admin/}")
                ;;
            esac
          done

          if (("${#FILES[@]}" > 0)); then
            bunx prettier --write "${FILES[@]}"
            git --no-pager diff -- "${FILES[@]}"
            if ! git diff --quiet -- "${FILES[@]}"; then
              echo "Prettier diff captured for repair; this diagnostic run intentionally fails."
              exit 1
            fi
          else
            echo "No frontend files changed; skipping Prettier."
          fi
      - name: TypeScript and production build
        run: bun run build
