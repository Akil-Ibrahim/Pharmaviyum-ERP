name: Temporary Prettier Probe

on:
  push:
    branches:
      - fix/restore-sidebar-icon-color-and-toggle

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        working-directory: frontend/shadcn-admin
        run: bun install --frozen-lockfile
      - name: Format and print nav-group
        working-directory: frontend/shadcn-admin
        run: |
          bunx prettier --write src/components/layout/nav-group.tsx
          cat src/components/layout/nav-group.tsx
