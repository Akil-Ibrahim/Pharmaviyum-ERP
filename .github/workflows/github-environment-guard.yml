name: GitHub Environment Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: environment-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-environments:
    name: Prevent retired production environment references
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Check workflow environment references
        run: python3 scripts/check_github_environments.py
