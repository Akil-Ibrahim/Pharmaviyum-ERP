name: Docker Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - docker-compose.codespaces.yml
      - docker-compose.monitoring.yml
      - .devcontainer/**
      - pyproject.toml
      - uv.lock
      - .python-version

permissions:
  contents: read

concurrency:
  group: pharmaviyum-docker-smoke
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Docker Engine and Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker versions
        run: |
          docker version
          docker compose version
          docker info

      - name: Validate development Compose configurations
        env:
          GRAFANA_ADMIN_PASSWORD: smoke-test-only
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.codespaces.yml config
          docker compose -f .devcontainer/docker-compose.devcontainer.yml config
          docker compose -f docker-compose.monitoring.yml config

      - name: Build application image
        run: docker build --tag pharmaviyum-crm:smoke-${GITHUB_SHA} .

      - name: Start infrastructure services
        run: docker compose -f docker-compose.yml up -d postgres redis

      - name: Wait for infrastructure
        run: |
          for i in {1..30}; do
            postgres_status=$(docker inspect --format='{{.State.Health.Status}}' pharmaviyum-postgres 2>/dev/null || true)
            redis_status=$(docker inspect --format='{{.State.Health.Status}}' pharmaviyum-redis 2>/dev/null || true)
            echo "postgres=${postgres_status} redis=${redis_status}"
            if [ "${postgres_status}" = "healthy" ] && [ "${redis_status}" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color postgres redis
          exit 1

      - name: Verify application image starts
        run: |
          docker run --rm \
            --network pharmaviyum-network \
            --entrypoint python \
            pharmaviyum-crm:smoke-${GITHUB_SHA} \
            -c 'import src.pharmaviyum.main; print("FastAPI import OK")'

      - name: Validate Celery app configuration in the built image
        run: |
          docker run --rm --network pharmaviyum-network \
            --env REDIS_URL=redis://redis:6379/0 \
            --entrypoint celery \
            pharmaviyum-crm:smoke-${GITHUB_SHA} \
            -A src.pharmaviyum.ai.mortarium_rag.ingestion.celery_app report

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v --remove-orphans
          docker image rm pharmaviyum-crm:smoke-${GITHUB_SHA} || true
