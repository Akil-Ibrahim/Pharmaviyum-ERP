name: FastAPI Cloud Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pharmaviyum-fastapi-cloud-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build frontend and deploy to FastAPI Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        working-directory: frontend/shadcn-admin
        run: |
          bun install
          bun run build
          rm -rf ../dist
          cp -R dist ../dist

      - name: Verify frontend artifact
        run: test -f frontend/dist/index.html

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install backend dependencies
        run: uv sync

      - name: Deploy to FastAPI Cloud
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: uv run fastapi deploy
