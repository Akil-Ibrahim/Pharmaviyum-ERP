name: Ansible Quality

on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-quality.yml"
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-quality.yml"

permissions:
  contents: read

jobs:
  ansible-syntax:
    name: Ansible syntax and lint
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"

      - name: Install pinned Ansible tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ansible/requirements.txt

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Validate playbook syntax against isolated lab inventory
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r playbook; do
            echo "Checking ${playbook}"
            ansible-playbook --syntax-check -i ansible/inventory/lab/hosts.yml "${playbook}"
          done < <(find ansible/playbooks -maxdepth 1 -type f -name '*.yml' | sort)

      - name: Lint starter deployment playbook
        run: ansible-lint --profile basic ansible/playbooks/deploy.yml
