name: Migrate production database

# Schema changes are isolated from application deployments and require an
# explicit manual dispatch against the verified Neon production endpoint.
on:
  workflow_dispatch:
    inputs:
      change_reference:
        description: "Approved change reference (for example: initial-production-schema-2026-11-18)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pharmaviyum-production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Alembic migrations to Neon production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-pharmaviyum-erp
      deployment: false
    if: github.ref == 'refs/heads/main'
    env:
      PYTHON_VERSION: "3.15.0"
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      EXPECTED_NEON_HOST: "ep-odd-wind-beh1cx41.c-9.us-east-2.aws.neon.tech"
      EXPECTED_DATABASE: "neondb"
    steps:
      - name: Checkout approved main revision
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Validate migration graph
        id: validate_graph
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"Refusing production migration: expected one Alembic head, found {heads}.")
          print(f"Verified single Alembic head: {heads[0]}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"expected_head={heads[0]}" + chr(10))
          PY

      - name: Inspect production database state and verify role separation
        id: inspect_database
        shell: bash
        env:
          EXPECTED_ALEMBIC_HEAD: ${{ steps.validate_graph.outputs.expected_head }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$MIGRATION_DATABASE_URL"
          uv run python - <<'PY'
          import os
          from urllib.parse import urlsplit
          import psycopg

          def normalize(raw_url: str) -> str:
              value = raw_url.replace("postgresql+asyncpg://", "postgresql://", 1)
              if value.startswith("postgres://"):
                  value = value.replace("postgres://", "postgresql://", 1)
              return value

          runtime_url = normalize(os.environ["DATABASE_URL"])
          migration_url = normalize(os.environ["MIGRATION_DATABASE_URL"])
          runtime_parsed = urlsplit(runtime_url)
          migration_parsed = urlsplit(migration_url)
          expected_host = os.environ["EXPECTED_NEON_HOST"]
          expected_database = os.environ["EXPECTED_DATABASE"]

          for label, parsed in (("runtime", runtime_parsed), ("migration", migration_parsed)):
              if parsed.hostname != expected_host:
                  raise SystemExit(
                      f"Refusing migration: {label} URL is not the verified direct Neon production endpoint."
                  )
              if parsed.path.lstrip("/") != expected_database:
                  raise SystemExit(
                      f"Refusing migration: {label} URL points to an unexpected database."
                  )

          if runtime_parsed.username == migration_parsed.username:
              raise SystemExit(
                  "Refusing migration: runtime and migration URLs must use distinct database roles."
              )

          with psycopg.connect(runtime_url, connect_timeout=15) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      SELECT current_database(), current_user,
                             current_setting('server_version'),
                             (SELECT count(*) FROM information_schema.tables
                              WHERE table_schema = 'public' AND table_type = 'BASE TABLE'),
                             to_regclass('public.alembic_version'),
                             role.rolsuper,
                             role.rolcreatedb,
                             role.rolcreaterole,
                             role.rolreplication,
                             role.rolbypassrls,
                             has_schema_privilege(current_user, 'public', 'CREATE'),
                             pg_has_role(current_user, 'neondb_owner', 'USAGE'),
                             EXISTS (
                               SELECT 1
                               FROM pg_class AS object
                               WHERE object.relnamespace = 'public'::regnamespace
                                 AND object.relkind IN ('r', 'p', 'v', 'm', 'S', 'f')
                                 AND pg_has_role(current_user, object.relowner, 'USAGE')
                             )
                      FROM pg_roles AS role
                      WHERE role.rolname = current_user
                      """
                  )
                  runtime = cursor.fetchone()

          if runtime is None:
              raise SystemExit("Refusing migration: runtime database role could not be verified.")

          (
              database,
              runtime_role,
              version,
              table_count,
              alembic_table,
              is_superuser,
              can_create_database,
              can_create_roles,
              can_replicate,
              bypasses_rls,
              can_create_in_public,
              is_owner_role_member,
              owns_or_inherits_public_objects,
          ) = runtime

          if database != expected_database:
              raise SystemExit("Refusing migration: runtime connection reached an unexpected database.")
          if any((is_superuser, can_create_database, can_create_roles, can_replicate, bypasses_rls)):
              raise SystemExit(
                  "Refusing migration: runtime role has privileged PostgreSQL role attributes."
              )
          if can_create_in_public or is_owner_role_member or owns_or_inherits_public_objects:
              raise SystemExit(
                  "Refusing migration: runtime role has schema CREATE, owner-role membership, "
                  "or ownership privileges on public objects."
              )

          with psycopg.connect(migration_url, connect_timeout=15) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      SELECT current_database(), current_user, role.rolsuper,
                             (current_user = 'neondb_owner'
                              OR pg_has_role(current_user, 'neondb_owner', 'USAGE'))
                      FROM pg_roles AS role
                      WHERE role.rolname = current_user
                      """
                  )
                  migration = cursor.fetchone()

          if migration is None:
              raise SystemExit("Refusing migration: migration database role could not be verified.")
          migration_database, migration_role, migration_is_superuser, has_owner_membership = migration
          if migration_database != expected_database or migration_role == runtime_role:
              raise SystemExit("Refusing migration: database role separation validation failed.")
          if migration_is_superuser or not has_owner_membership:
              raise SystemExit(
                  "Refusing migration: migration role must be a non-superuser member of "
                  "the dedicated Neon database owner role."
              )

          print(
              f"Verified production database={database}, PostgreSQL={version}, "
              f"runtime_role_separated=true, public_tables={table_count}, "
              f"alembic_version={alembic_table}."
          )

          expected_head = os.environ["EXPECTED_ALEMBIC_HEAD"]
          baseline_revision = "2026_11_16_000004"
          revisions = []
          required_tables = ()
          with psycopg.connect(runtime_url, connect_timeout=15) as connection:
              with connection.cursor() as cursor:
                  if alembic_table is not None:
                      cursor.execute("SELECT version_num FROM public.alembic_version")
                      revisions = [row[0] for row in cursor.fetchall()]
                  cursor.execute(
                      """
                      SELECT
                        to_regclass('public.inventory_movements') IS NOT NULL,
                        to_regclass('public.users') IS NOT NULL,
                        to_regclass('public.pharmacies') IS NOT NULL,
                        to_regclass('public.sales') IS NOT NULL,
                        to_regclass('public.outbox_events') IS NOT NULL
                      """
                  )
                  required_tables = cursor.fetchone()

          print(f"Existing Alembic revisions: {revisions}")
          print(f"Required application tables present: {all(required_tables)}")
          if not all(required_tables):
              raise SystemExit(
                  "Refusing incremental production migration: one or more required baseline tables are missing. "
                  f"Observed table checks={required_tables}."
              )

          if revisions == [expected_head]:
              print("Production schema is already at the code's Alembic head; no migration is needed.")
              migration_required = "false"
          elif revisions == [baseline_revision]:
              print(
                  "Verified production baseline. The reviewed additive migration chain "
                  f"will advance schema from {baseline_revision} to {expected_head}."
              )
              migration_required = "true"
          else:
              raise SystemExit(
                  "Refusing production migration: database revision is not an explicitly supported state. "
                  f"Allowed revisions={[baseline_revision, expected_head]}; found={revisions}."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"migration_required={migration_required}" + chr(10))
          PY

      - name: Apply all Alembic migrations
        if: steps.inspect_database.outputs.migration_required == 'true'
        run: uv run alembic upgrade head

      - name: Verify final production schema revision
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic current
          uv run python - <<'PY'
          import os
          import psycopg

          raw_url = os.environ["DATABASE_URL"]
          normalized = raw_url.replace("postgresql+asyncpg://", "postgresql://", 1)
          if normalized.startswith("postgres://"):
              normalized = normalized.replace("postgres://", "postgresql://", 1)

          with psycopg.connect(normalized, connect_timeout=15) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT version_num FROM alembic_version")
                  revisions = [row[0] for row in cursor.fetchall()]
                  cursor.execute(
                      "SELECT count(*) FROM information_schema.tables "
                      "WHERE table_schema = 'public' AND table_type = 'BASE TABLE'"
                  )
                  table_count = cursor.fetchone()[0]

          print(f"Applied Alembic revisions: {revisions}")
          print(f"Public base tables: {table_count}")
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          expected_heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(expected_heads) != 1 or revisions != expected_heads:
              raise SystemExit(
                  "Production schema did not reach the code's single Alembic head. "
                  f"Expected={expected_heads}; actual={revisions}."
              )
          if table_count < 1:
              raise SystemExit("Migration completed without creating the expected schema.")
          PY
