name: Ansible UI Prettier diagnostic

on:
  push:
    branches:
      - feat/ansible-developer-settings-main

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        working-directory: frontend/shadcn-admin
        run: bun install --frozen-lockfile
      - name: Run Prettier and print exact diff
        working-directory: frontend/shadcn-admin
        run: |
          bunx prettier --write src/routes/_authenticated/settings/developer.tsx src/routes/_authenticated/settings/developer/ansible.tsx
          git diff -- src/routes/_authenticated/settings/developer.tsx src/routes/_authenticated/settings/developer/ansible.tsx
