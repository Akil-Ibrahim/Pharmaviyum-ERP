name: Library Skills Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "frontend/shadcn-admin/package.json"
      - "frontend/shadcn-admin/bun.lock"
      - ".agents/skills/**"
      - "frontend/shadcn-admin/.agents/skills/**"
      - "docs/development/library-skills.md"

permissions:
  contents: read

concurrency:
  group: library-skills-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover package-provided agent skills
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Set up uv and CPython
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          python-version: "3.15.2"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --frozen

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install locked frontend dependencies
        working-directory: frontend/shadcn-admin
        run: bun install --frozen-lockfile

      - name: Scan Python dependency skills
        run: uvx --from "library-skills==0.0.21" library-skills scan --json > python-library-skills.json

      - name: Scan frontend dependency skills
        working-directory: frontend/shadcn-admin
        run: npx --yes library-skills@0.0.21 scan --json > ../../frontend-library-skills.json

      - name: Summarize discovery
        if: always()
        shell: bash
        run: |
          {
            echo "## Library Skills discovery"
            echo
            echo "The workflow performs discovery only. It does not install or execute package-provided instructions."
            echo
            echo "- Python report: python-library-skills.json"
            echo "- Frontend report: frontend-library-skills.json"
            echo
            echo "Review the uploaded artifact before installing any discovered skill."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-skills-discovery
          path: |
            python-library-skills.json
            frontend-library-skills.json
          if-no-files-found: warn
          retention-days: 14
