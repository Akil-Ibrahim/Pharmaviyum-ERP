# Production overrides
# Applied via: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Optimizes for security, stability, and resource management

services:
  backend:
    # Use a pre-built production image instead of building from source
    image: pharmaviyum-crm-backend:latest
    # Always restart the container to ensure high availability
    restart: always
    # Production environment settings
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    # Resource constraints to prevent memory leaks on pharmacy PCs
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    # Do not expose ports directly; access only through Nginx reverse proxy
