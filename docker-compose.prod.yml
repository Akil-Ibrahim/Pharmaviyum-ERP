version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Keep the existing production data volume and major version until a separately approved migration.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # Production Redis major upgrade is a separate migration; keep the existing data volume for now.
    # ... (как в предыдущем docker-compose.yml)

  # vLLM вместо Ollama
  vllm:
    image: vllm/vllm-openai:latest
    container_name: pharmaviyum-vllm
    ports:
      - "8001:8000"
    volumes:
      - vllm_cache:/root/.cache
    command: >
      --model Qwen/Qwen2.5-7B-Instruct
      --host 0.0.0.0
      --port 8000
      --max-model-len 4096
      --gpu-memory-utilization 0.9
      --enable-prefix-caching
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - pharmaviyum-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Изменить на vLLM
      OLLAMA_BASE_URL: http://vllm:8000/v1  # OpenAI-compatible
      OLLAMA_API_KEY: token-abc123
      OLLAMA_MAIN_MODEL: Qwen/Qwen2.5-7B-Instruct
    # ... (остальная конфигурация)

volumes:
  postgres_data:
  redis_data:
  vllm_cache:

networks:
  pharmaviyum-network:
    driver: bridge
